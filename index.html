<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vòlei 26-27</title>
<meta name="theme-color" content="#14325a">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f1f3f8; --card: #ffffff; --ink: #14202e; --muted: #5d6a7c; --line: #e1e6ee;
  --brand: #14325a; --brand-soft: #e5edf8; --accent: #f5c518; --accent-ink: #14202e;
  --si: #17864b; --si-soft: #e1f5e9; --avisa: #6b7480; --avisa-soft: #eef0f3; --no: #c8322a; --no-soft: #fde7e5;
  --shadow: 0 1px 2px rgba(20,32,46,.06), 0 4px 14px rgba(20,32,46,.06);
  --head: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  /* un color per família d'exercicis */
  --f-D: #2f7de1; --f-B: #12a07c; --f-S: #8b5cf6; --f-R: #e8590c; --f-BL: #d6336c; --f-C: #0b9fbd; --f-J: #4c5fd5; --f-G: #e09a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1219; --card: #161e29; --ink: #e8edf3; --muted: #9aa7b6; --line: #263241;
    --brand: #8cbcf0; --brand-soft: #1a2c42; --accent: #f5c518; --accent-ink: #14202e;
    --si: #6cd39a; --si-soft: #14301f; --avisa: #9aa7b6; --avisa-soft: #1f2731; --no: #ff7b72; --no-soft: #3a1a18;
    --shadow: none;
    --f-D: #6aa8f5; --f-B: #3fd1a8; --f-S: #b197fc; --f-R: #ff8c4a; --f-BL: #f06595; --f-C: #3bc9db; --f-J: #8c9bff; --f-G: #ffc14d;
  }
}
:root[data-theme="dark"] {
    --bg: #0d1219; --card: #161e29; --ink: #e8edf3; --muted: #9aa7b6; --line: #263241;
    --brand: #8cbcf0; --brand-soft: #1a2c42; --accent: #f5c518; --accent-ink: #14202e;
    --si: #6cd39a; --si-soft: #14301f; --avisa: #9aa7b6; --avisa-soft: #1f2731; --no: #ff7b72; --no-soft: #3a1a18;
    --shadow: none;
    --f-D: #6aa8f5; --f-B: #3fd1a8; --f-S: #b197fc; --f-R: #ff8c4a; --f-BL: #f06595; --f-C: #3bc9db; --f-J: #8c9bff; --f-G: #ffc14d;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-feature-settings: 'locl' 0 !important; }   /* sense 'locl', la l·l de la Barlow es veu bé */
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.5 Barlow, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 80px; }
header { position: sticky; top: 0; z-index: 5; background: linear-gradient(120deg, #14325a 0%, #0c2340 70%); color: #fff; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; box-shadow: inset 0 -4px 0 var(--accent); overflow: hidden; }
header::after { content: ''; position: absolute; right: -26px; top: -30px; width: 110px; height: 110px; border-radius: 50%; border: 10px solid rgba(255,255,255,.06); box-shadow: inset 18px 0 0 -8px rgba(255,255,255,.05); pointer-events: none; }
header h1 { font: 800 22px/1.1 var(--head); text-transform: uppercase; letter-spacing: .03em; margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header h1 .ball { flex: none; width: 28px; height: 28px; }
header button { background: rgba(255,255,255,.1); border: 0; color: #fff; font-size: 20px; width: 40px; height: 40px; border-radius: 12px; padding: 0; cursor: pointer; display: grid; place-items: center; position: relative; z-index: 1; }
header button:active { background: rgba(255,255,255,.22); }
header button[hidden] { display: none; }
header #tbtn.run { background: var(--accent); color: var(--accent-ink); }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 4px 4px env(safe-area-inset-bottom); z-index: 5; box-shadow: 0 -4px 18px rgba(20,32,46,.07); }
nav.tabs a { flex: 1; text-align: center; padding: 6px 2px 8px; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs a .ico { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 15px; transition: background .2s; }
nav.tabs a .ico svg { width: 22px; height: 22px; }
nav.tabs a.on { color: var(--brand); }
nav.tabs a.on .ico { background: var(--brand-soft); }
h2 { font: 800 26px/1.15 var(--head); margin: 4px 0 12px; letter-spacing: .01em; }
h3 { font: 700 15px/1.2 var(--head); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; display: flex; align-items: center; gap: 8px; }
h3::before { content: ''; width: 14px; height: 4px; border-radius: 2px; background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
a.card { display: block; color: inherit; text-decoration: none; }
.next { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .next { grid-template-columns: 1fr; } }
.next .card { border-left: 4px solid var(--brand); }
.kicker { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.big { font-size: 18px; font-weight: 650; margin-top: 2px; }
.meta { color: var(--muted); font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.code { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--brand); }
.list a.card, .list .card { padding: 11px 14px; }
.list .fet { opacity: .55; }
.tag { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 6px; padding: 1px 7px; border: 1px solid currentColor; white-space: nowrap; color: var(--muted); }
.note { font-style: italic; color: var(--muted); margin: 6px 0 14px; }
.block { border-left: 5px solid var(--fc, var(--line)); }
.bhead { display: flex; gap: 10px; align-items: baseline; }
.bnum { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--fc, var(--brand)); color: #fff; font: 800 17px/1 var(--head); align-self: center; }
.btitle { flex: 1; font-weight: 650; font-size: 17px; }
.bmin { text-align: right; white-space: nowrap; font: 700 18px/1.1 var(--head); color: var(--brand); }
.bmin small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.tags { margin: 6px 0 4px 40px; }
.field { margin: 8px 0 0 40px; }
.field b { color: var(--brand); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; display: block; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
a.btn { display: inline-block; text-decoration: none; text-align: center; }
button.btn, a.btn { font: inherit; font-size: 15px; font-weight: 600; border-radius: 12px; padding: 9px 14px; min-height: 42px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: transform .08s; }
button.btn:active, a.btn:active, .tri button:active, .seg button:active { transform: scale(.96); }
button.btn.primary, a.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.btn.primary { color: #0f141a; } }
:root[data-theme="dark"] button.btn.primary { color: #0f141a; }
button.btn:disabled { opacity: .45; }
button.btn.danger { color: var(--no); }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.empty { color: var(--muted); text-align: center; padding: 30px 0; }
textarea, input[type=text], input[type=date], select { width: 100%; font: 16px/1.45 Barlow, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 9px 10px; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
textarea { min-height: 110px; }
label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
.selbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.selbar .grow { flex: 1; color: var(--muted); font-size: 14px; }
.selbar.bottom { position: fixed; left: 0; right: 0; bottom: 64px; margin: 0; padding: 10px 16px; background: var(--card); border-top: 1px solid var(--line); z-index: 4; justify-content: center; }
.selrow { cursor: pointer; }
.chk { width: 20px; height: 20px; accent-color: var(--brand); }
.chkline { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.chkline input { width: 18px; height: 18px; accent-color: var(--brand); }
.comment .meta { margin-bottom: 4px; }
/* Assistència */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow); }
.stat b { display: block; font: 800 30px/1.1 var(--head); color: var(--brand); }
.stat span { font-size: 12px; color: var(--muted); }
.pl { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.pl:last-child { border-bottom: 0; }
.pl .nom { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; }
.pl .nom > a, .pl .nom .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pl .av { width: 28px; height: 28px; font-size: 12px; }
.pl .nom.no { color: var(--no); }
.tri { display: flex; gap: 4px; }
.tri { gap: 3px; }
.tri button { font: inherit; font-size: 15px; line-height: 1; border-radius: 9px; width: 38px; height: 34px; padding: 0; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; filter: grayscale(1); opacity: .35; }
.tri button.on { filter: none; opacity: 1; border-width: 2px; }
.tri button.on.si { background: var(--si-soft); border-color: var(--si); color: var(--si); }
.tri button.on.avisa { background: var(--avisa-soft); border-color: var(--avisa); color: var(--ink); }
.tri button.on.no { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; width: 70px; }
.bar i { display: block; height: 100%; background: var(--si); }
.pct.mes { width: 50px; color: var(--muted); }
.pct.mes.baixa { color: var(--no); }
.phead { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 0; }
.phead .pct { font-weight: 600; }
.pl .pct:not(.mes) { width: 50px; }
.pct { width: 44px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.red { color: var(--no); font-weight: 700; }
.warn { border-left: 4px solid var(--no); }
/* Cronòmetre */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(8,14,24,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; animation: fade .15s ease-out; }
.modal[hidden] { display: none; }
.mbox { width: 100%; max-width: 380px; background: var(--card); border-radius: 22px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.35); animation: pop .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.dico { font-size: 34px; text-align: center; line-height: 1; margin-bottom: 8px; }
.dtxt { text-align: center; font-size: 17px; line-height: 1.4; margin-bottom: 18px; }
.dtxt small { color: var(--muted); font-size: 14px; }
.dbtns { display: flex; gap: 8px; }
.dbtns .btn { flex: 1; min-height: 46px; }
button.btn.danger-fill { background: var(--no); border-color: var(--no); color: #fff; }
.tbox { border-top: 6px solid var(--accent); }
.thead { display: flex; align-items: center; justify-content: space-between; font: 800 18px/1 var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.thead .tx { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bg); color: var(--ink); font-size: 16px; cursor: pointer; }
#timer .digits { font: 800 84px/1 var(--head); text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; margin: 6px 0; }
#timer .digits input { font: inherit; color: inherit; width: 2.3ch; text-align: center; border: 0; border-bottom: 2px dashed var(--line); background: transparent; padding: 0; }
#timer .digits input:focus { outline: none; border-bottom-color: var(--brand); }
#timer .hint { text-align: center; font-size: 12px; color: var(--muted); }
#timer .digits.end { color: var(--no); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .3; } }
#timer .lab { text-align: center; color: var(--muted); font-size: 13px; min-height: 18px; }
#timer .actions { justify-content: center; margin-top: 8px; }
#timer .presets { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
#timer .presets button { font: inherit; font-size: 13px; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
#tmini { position: fixed; right: 14px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 7; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--accent); color: var(--accent-ink); font: 800 20px/1 var(--head); box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer; font-variant-numeric: tabular-nums; }
#tmini[hidden] { display: none; }
#tmini.end { background: var(--no); color: #fff; animation: blink 1s steps(2) infinite; }
#tstop { display: block; width: 100%; padding: 14px; margin-bottom: 8px; font-size: 18px; background: var(--no); border-color: var(--no); color: #fff; }
#tstop[hidden] { display: none; }
.chip { font: inherit; font-size: 14px; font-weight: 650; border-radius: 999px; padding: 6px 12px; border: 1px solid var(--brand); background: var(--brand-soft); color: var(--brand); cursor: pointer; }
/* Exercici no fet */
.block.nofet { opacity: .75; border-left-color: var(--no); }
.nofetbox { margin: 10px 0 0 40px; padding: 8px 10px; border-radius: 8px; background: var(--no-soft); font-size: 14px; }
.motius { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.motius button { font: inherit; font-size: 13px; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.motius button.on { border-color: var(--no); color: var(--no); background: var(--no-soft); font-weight: 650; }
.bfoot { display: flex; gap: 8px; margin: 12px 0 0 40px; flex-wrap: wrap; }
button.small { font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 6px 12px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
/* Equip */
.edit-pl { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.edit-pl input[type=text] { flex: 1; min-width: 120px; }
.edit-pl label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.inactiu { opacity: .55; }
.dd { display: flex; gap: 3px; flex: none; }
.dd button { font: inherit; font-size: 12px; font-weight: 700; width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; padding: 0; }
.dd button.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.cfgday { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.cfgday:last-child { border-bottom: 0; }
.cfgday span { flex: 1; font-weight: 600; }
.cfgday select { width: auto; }
/* Jugador */
a.nomlink { color: inherit; text-decoration: none; }
.hist { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.hist:last-child { border-bottom: 0; }
.hist .grow { flex: 1; }
.est { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px; }
.est.si { background: var(--si-soft); color: var(--si); }
.est.avisa { background: var(--avisa-soft); color: var(--ink); }
.est.no { background: var(--no-soft); color: var(--no); }
/* Partits */
.seg { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.seg button { flex: 1; font: inherit; font-size: 15px; font-weight: 600; border-radius: 12px; padding: 8px; min-height: 40px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
.seg button.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.eqN { background: #17202b; color: #fff; border-color: #17202b; }
.eqG { background: #f2c230; color: #17202b; border-color: #d9a90f; }
.conv { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.conv:last-child { border-bottom: 0; }
.conv input { width: 20px; height: 20px; accent-color: var(--brand); }
.conv .grow { flex: 1; }
.sets { display: grid; gap: 6px; }
.setrow { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px; padding: 2px 6px; border-radius: 8px; }
.setrow span { font-size: 14px; font-weight: 600; color: var(--muted); }
.setrow input { text-align: center; padding: 6px; min-width: 0; width: 100%; }
.setrow.guanyat { background: var(--si-soft); }
.setrow.perdut { background: var(--no-soft); }
.calnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.calnav b { font: 800 20px/1 var(--head); }
.calsw { overflow: hidden; padding: 2px; }
.calsw .swiper-slide { background: var(--bg); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: var(--card); border-radius: 10px; overflow: hidden; }
.ch { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 5px 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-transform: uppercase; }
.cd { min-height: 76px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 3px 2px; display: flex; flex-direction: column; gap: 3px; overflow: hidden; min-width: 0; }
.cd.buit { background: var(--bg); opacity: .5; }
.cd.sel { background: var(--brand-soft); }
.cd .dn { font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; line-height: 22px; }
.cd.avui .dn { background: var(--brand); color: var(--card); border-radius: 50%; width: 22px; height: 22px; margin: 0 auto; }
.cd:not(.buit) { cursor: pointer; }
.cd:not(.buit):active { background: var(--brand-soft); }
.daypanel { margin-top: 12px; }
.convchips { display: flex; flex-wrap: wrap; gap: 6px; }
.cchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.cchip .av { width: 26px; height: 26px; font-size: 12px; }
.cp { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 1px; border-radius: 5px; font: 400 12px/1.15 var(--head); border: 1px solid transparent; padding: 3px 2px; }
.cp.eqN { background: #000; color: #fff; border-color: #5a6372; }
.cp.eqG { background: #f5c518; color: #14181f; border-color: #d9a90f; }
.cp.guanyat { border: 3px solid #22b35e; padding: 1px 0; }
.cp.perdut { border: 3px solid #ef4136; padding: 1px 0; }
.cp i { font-style: normal; font-size: 11px; line-height: 1; }
.cp .rv { width: 100%; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cp .hr { font-size: 10px; opacity: .8; }
.callegend i.w { background: transparent; border: 3px solid #22b35e; } .callegend i.l { background: transparent; border: 3px solid #ef4136; }
.callegend i.n { border-color: #5a6372; }
.gd.guanyat { background: #22b35e; } .gd.perdut { background: #ef4136; }
.callegend { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
.callegend span { display: inline-flex; align-items: center; gap: 5px; }
.callegend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid #14181f; }
.callegend i.n { background: #14181f; } .callegend i.g { background: #f5c518; }

const FAM = { D: 'Dits i col·locació', B: 'Braços, recepció i defensa', S: 'Saque', R: 'Remat', BL: 'Bloqueig', C: 'Col·locadors', J: 'Jugada', G: 'Jocs' };

  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const num = c => +c.slice(2);
const famC = c => (/^(BL|[DBSRCJG])\d/.exec(c || '') || [])[1] || '';   // família d'un codi d'exercici (D5 -> D, BL1 -> BL)
const hue = t => [...t].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const inicials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const av = (j, lg) => `<span class="av ${lg ? 'lg' : ''}" style="--h:${hue(j.nom || '')}" aria-hidden="true">${esc(inicials(j.nom))}</span>`;
const ICO = {"inici": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z\"/></svg>", "pista": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 12h18\"/><path d=\"M3 8.5h18\" stroke-dasharray=\"2 2\" opacity=\".6\"/></svg>", "pistes": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"5\" width=\"9\" height=\"14\" rx=\"1.5\"/><rect x=\"13\" y=\"5\" width=\"9\" height=\"14\" rx=\"1.5\"/><path d=\"M2 12h9M13 12h9\"/></svg>", "ass": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"/><path d=\"M2.5 20c.8-3.6 3.3-5.5 6.5-5.5 1.6 0 3 .5 4.1 1.4\"/><path d=\"M15 18l2.2 2.2L22 15.4\"/></svg>", "partits": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 4h10v5a5 5 0 0 1-10 0z\"/><path d=\"M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11M17 6h3v1.5a3.5 3.5 0 0 1-3.5 3.5\"/><path d=\"M12 14v3M8.5 20h7l-1-3h-5z\"/></svg>"};
const avui = () => new Date().toISOString().slice(0, 10);
const dataCa = d => new Date(d + 'T12:00').toLocaleDateString('ca', { weekday: 'short', day: 'numeric', month: 'short' });

// clau des de l'enllaç
const m = location.hash.match(/clau=([A-Za-z0-9]{24,})/);
if (m) { store.set('volei.clau', m[1]); history.replaceState(null, '', location.pathname + (location.hash.replace(/[?&]?clau=[A-Za-z0-9]+/, '') || '#/')); }
let CLAU = store.get('volei.clau', null);
// invitació: #/uneix/{clau}/{codi}
const mInv = location.hash.match(/^#\/uneix\/([A-Za-z0-9]{24,})\/([A-Za-z0-9]{12,})/);
if (mInv) store.set('volei.invitacio', { clau: mInv[1], codi: mInv[2] });
tema(store.get('volei.tema', 'auto'));

// Temporades: config a /equips/{clau}/config/app; dades de cada temporada a /equips/{clau}/temporades/{T}/...
// Cada dia d'entreno (dl..dv) es lliga a una família de sessions: DT = 1 pista, DJ = 2 pistes.
const DIES = { 1: 'Dilluns', 2: 'Dimarts', 3: 'Dimecres', 4: 'Dijous', 5: 'Divendres' };
const CURT = { 1: 'Dl', 2: 'Dt', 3: 'Dc', 4: 'Dj', 5: 'Dv' };
const PISTES = { DT: '1 pista', DJ: '2 pistes' };
const CFG_DEF = { actual: '26-27', temporades: { '26-27': { dies: { 2: 'DT', 4: 'DJ' }, sessions: 'data/sessions.json' } } };
let CFG = CFG_DEF, TEMP = store.get('volei.temp', null);
const tcfg = () => CFG.temporades[TEMP] || CFG.temporades[CFG.actual] || CFG_DEF.temporades['26-27'];
// Equips: cada temporada pertany a un equip (club, dies, jugadors, partits i sessions propis).
// L'equip de sempre és «principal» (el seu club és CFG.club); els altres són a CFG.grups[g] = {nom, club, nEq}.
const GP = 'principal';
const grups = () => { const g = CFG.grups || {}; return { [GP]: { nom: CFG.club || 'Equip', nEq: 2, ...(g[GP] || {}), club: CFG.club || '' }, ...Object.fromEntries(Object.entries(g).filter(([k]) => k !== GP)) }; };
const grupDe = t => CFG.temporades[t]?.grup || GP;
const gcfg = () => grups()[grupDe(TEMP)] || grups()[GP];
const club = () => gcfg().club || '';
const dosEq = () => +(gcfg().nEq || 2) === 2;            // 2 equips de partit (Negre i Groc) o 1 de sol
const tempNom = t => CFG.temporades[t]?.nom || t;
const fam = s => s.codi.slice(0, 2);
const diesDe = f => Object.keys(tcfg().dies).filter(d => tcfg().dies[d] === f).map(Number).sort();
const famLabel = f => diesDe(f).map(d => DIES[d]).join(' i ') || (f === 'DT' ? 'Sessions DT' : 'Sessions DJ');
const famDia = data => tcfg().dies[new Date(data + 'T12:00').getDay()] || null;

let D;                                               // sessions de la temporada
let FETS = {}, COMS = [], JUG = [], ASS = [], NOF = {}, ORD = {}, PAR = []; // dades de Firebase (NOF: exercicis no fets)
let UNSUB = [];
let fs = null, db = null;
let sel = null;                                      // selecció múltiple de sessions
let editAss = null;                                  // entreno d'assistència en edició

const byCode = c => D.sessions.find(s => s.codi === c);
const isFet = c => !!FETS[c]?.fet;
const comments = c => COMS.filter(x => x.codi === c).sort((a, b) => b.t - a.t);
const col = name => fs.collection(db, 'equips', CLAU, 'temporades', TEMP, name);
const ref = (name, id) => fs.doc(db, 'equips', CLAU, 'temporades', TEMP, name, id);
const cfgRef = () => fs.doc(db, 'equips', CLAU, 'config', 'app');

// Usuaris (fase 1): cada persona entra amb Google. A /equips/{clau}/membres/{uid} hi ha el seu rol a cada equip
// (admin | entrenador | lector). Mentre no s'activin les regles noves, qui té la clau al mòbil continua entrant sense compte.
let auth = null, AM = null, USR = undefined, MEM = null, MEMBRES = [], unsubMem = [];
const ROLS = { admin: 'Administrador', entrenador: 'Entrenador', lector: 'Només mirar' };
const memRef = uid => fs.doc(db, 'equips', CLAU, 'membres', uid);
const rolDe = g => USR ? (MEM?.rols || {})[g] || null : (CLAU ? 'admin' : null);   // sense compte i amb clau: com fins ara
const rolActual = () => rolDe(grupDe(TEMP));
const esAdmin = () => !USR ? !!CLAU : Object.values(MEM?.rols || {}).includes('admin');
async function initFirebase() {
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js');
    const mod = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');
    // cada escriptura avisa amb un «✓ Desat» petit (tot es desa sol); qui només mira no pot escriure dades de l'equip
    const avisa = f => (r, ...a) => {
      if (rolActual() === 'lector' && /\/(temporades|config)\b/.test(r?.path || '')) { desat('👀 Només pots mirar'); return Promise.resolve(); }
      desat(); return f(r, ...a);
    };
    fs = { ...mod, setDoc: avisa(mod.setDoc), updateDoc: avisa(mod.updateDoc), addDoc: avisa(mod.addDoc), deleteDoc: avisa(mod.deleteDoc) };
    const app = initializeApp(FB);
    db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache() });
    try {
      AM = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js');
      auth = AM.getAuth(app); AM.getRedirectResult(auth).catch(() => {});
      AM.onAuthStateChanged(auth, u => { USR = u || null; quiSoc(); });
    } catch (e) { console.error(e); USR = null; }
    if (CLAU) connecta();
    if (!auth) render();
  } catch (e) { console.error(e); }
}
let connectat = null;
function connecta() {
  if (!CLAU || connectat === CLAU) return; connectat = CLAU;
  fs.onSnapshot(cfgRef(), d => {
    CFG = d.exists() ? d.data() : CFG_DEF;
    triaTemporadaPermesa();
    openSeason();
  });
}
// només els equips on tens rol; si la temporada triada no és d'un d'ells, se'n tria una que sí
function triaTemporadaPermesa() {
  if (!CFG.temporades?.[TEMP]) TEMP = CFG.actual;
  if (USR && MEM && !rolDe(grupDe(TEMP))) {
    const t = Object.keys(CFG.temporades || {}).filter(x => rolDe(grupDe(x))).sort().pop();
    if (t) { TEMP = t; store.set('volei.temp', t); }
  }
}
async function quiSoc() {
  unsubMem.forEach(u => u()); unsubMem = []; MEM = null; MEMBRES = [];
  if (!USR) { render(); return; }
  const inv = store.get('volei.invitacio', null);
  if (inv) { await acceptaInvitacio(inv); return; }
  // espai: el del mòbil o, si no n'hi ha, el del compte
  if (!CLAU) { try { const u = await fs.getDoc(fs.doc(db, 'usuaris', USR.uid)); const e = u.data()?.espais || []; if (e.length) { CLAU = e[0]; store.set('volei.clau', CLAU); } } catch {} }
  if (!CLAU) { render(); return; }
  connecta();
  try {
    let d = await fs.getDoc(memRef(USR.uid));
    if (!d.exists()) {
      // el primer compte que entra amb la clau és l'administrador de tots els equips; els altres queden pendents
      const algu = await fs.getDocs(fs.query(fs.collection(db, 'equips', CLAU, 'membres'), fs.limit(1)));
      const rols = algu.empty ? Object.fromEntries(Object.keys(grups()).map(g => [g, 'admin'])) : {};
      await fs.setDoc(memRef(USR.uid), { email: USR.email || '', nom: USR.displayName || '', foto: USR.photoURL || '', rols, alta: Date.now(), ...(algu.empty ? {} : { pendent: true }) });
    }
    fs.setDoc(fs.doc(db, 'usuaris', USR.uid), { espais: fs.arrayUnion(CLAU), email: USR.email || '' }, { merge: true }).catch(() => {});
  } catch (e) { registraError(e, 'membre'); }
  unsubMem.push(fs.onSnapshot(memRef(USR.uid), d => { MEM = d.data() || null; triaTemporadaPermesa(); openSeason(); }));
  unsubMem.push(fs.onSnapshot(fs.collection(db, 'equips', CLAU, 'membres'), q => { MEMBRES = q.docs.map(d => ({ uid: d.id, ...d.data() })); render(); }, () => {}));
}
async function acceptaInvitacio({ clau, codi }) {
  try {
    const iref = fs.doc(db, 'equips', clau, 'invitacions', codi), inv = await fs.getDoc(iref);
    if (!inv.exists() || (inv.data().usada && inv.data().usada !== USR.uid)) { store.set('volei.invitacio', null); await dialeg('Aquesta invitació ja s\'ha fet servir o no existeix. Demana\'n una de nova.', { sol: true }); location.hash = '#/'; return quiSoc(); }
    CLAU = clau; store.set('volei.clau', clau); store.set('volei.invitacio', null);
    const mref = memRef(USR.uid), ja = await fs.getDoc(mref), rols = { ...(ja.data()?.rols || {}), ...inv.data().rols };
    await fs.setDoc(mref, { email: USR.email || '', nom: USR.displayName || '', foto: USR.photoURL || '', rols, invitacio: codi, alta: ja.data()?.alta || Date.now(), pendent: false }, { merge: true });
    await fs.updateDoc(iref, { usada: USR.uid, usadaPer: USR.email || '' });
    location.hash = '#/'; desat('✓ Benvingut a l\'equip!'); connectat = null; quiSoc();
  } catch (e) { registraError(e, 'invitacio'); dialeg('No s\'ha pogut acceptar la invitació. Torna-ho a provar.', { sol: true }); }
}
window.entra = async () => {
  if (!auth) return dialeg('No es pot connectar. Comprova la connexió.', { sol: true });
  const prov = new AM.GoogleAuthProvider(); prov.setCustomParameters({ prompt: 'select_account' });
  try { await AM.signInWithPopup(auth, prov); }
  catch (e) {
    if (/popup-blocked|popup-closed-by-user|cancelled-popup|operation-not-supported/.test(e.code || '')) { if (!/closed-by-user|cancelled/.test(e.code)) AM.signInWithRedirect(auth, prov); }
    else { registraError(e, 'login'); dialeg(`No s'ha pogut entrar.<br><small>${esc(e.code || e.message)}</small>`, { sol: true }); }
  }
};
window.surt = async () => { if (await dialeg('Sortir del teu compte en aquest mòbil?', { ok: 'Surt' })) { await AM.signOut(auth); } };
async function openSeason() {
  // sessions i dades de la temporada triada
  const t = tcfg(), file = 'sessions' in t && !t.sessions ? '' : t.sessions || 'data/sessions.json';   // '' = equip sense sessions encara
  if (D?.__file !== file) {
    if (!file) D = { sessions: [], calendari: [], __file: '' };
    else try { D = await (await fetch(file, { cache: 'no-cache' })).json(); D.__file = file; } catch {}
  }
  if (UNSUB.__t === TEMP) return render();
  UNSUB.forEach(u => u()); UNSUB = []; UNSUB.__t = TEMP;
  FETS = {}; COMS = []; JUG = []; ASS = []; NOF = {}; ORD = {}; PAR = [];
  UNSUB.push(fs.onSnapshot(ref('estat', 'fets'), d => { FETS = d.data() || {}; render(); }));
  UNSUB.push(fs.onSnapshot(col('comentaris'), q => { COMS = q.docs.map(d => ({ id: d.id, ...d.data() })); render(); }));
  UNSUB.push(fs.onSnapshot(col('jugadors'), q => { JUG = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nom.localeCompare(b.nom, 'ca')); render(); }));
  UNSUB.push(fs.onSnapshot(col('ordre'), q => { ORD = {}; q.docs.forEach(d => ORD[d.id] = d.data().ordre); render(); }));
  UNSUB.push(fs.onSnapshot(col('exercicis'), q => { NOF = {}; q.docs.forEach(d => NOF[d.id] = d.data()); render(); }));
  UNSUB.push(fs.onSnapshot(col('partits'), q => { PAR = q.docs.map(d => ({ id: d.id, ...d.data() })).map(p => ({ ...p, data: p.data || avui(), convocats: Array.isArray(p.convocats) ? p.convocats : [], accions: Array.isArray(p.accions) ? p.accions : [], sets: p.sets || {} })).sort((a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || ''))); render(); }));
  UNSUB.push(fs.onSnapshot(col('assistencia'), q => { ASS = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.data.localeCompare(a.data)); render(); }));
  render();
}

function setFets(codes, fet) {
  if (!db) return;
  const t = Date.now(), patch = {};
  codes.forEach(c => { patch[c] = { fet, t }; FETS[c] = { fet, t }; });
  fs.setDoc(ref('estat', 'fets'), patch, { merge: true });
  render();
}

// ------------------------------------------------------------------ sessions
function next(f) {
  return D.sessions.filter(s => fam(s) === f && !isFet(s.codi)).sort((a, b) => num(a.codi) - num(b.codi))[0];
}

function sessRow(s, prox) {
  const n = comments(s.codi).length, fet = isFet(s.codi);
  const fams = [...new Set(s.blocs.filter(b => !b.tret).map(b => famC(b.codi)).filter(Boolean))];
  const inner = `<div class="row">
    ${sel ? `<input type="checkbox" class="chk" ${sel.has(s.codi) ? 'checked' : ''}>` : ''}
    <span class="sbadge">${s.codi.slice(0, 2)}<b>${s.codi.slice(2)}</b></span>
    <span class="grow"><span class="stit">${esc(s.titol)}</span><span class="sfams">${fams.map(k => `<i class="f-${k}" title="${FAM[k]}"></i>`).join('')}</span></span>
    ${n ? `<span class="tag">💬 ${n}</span>` : ''}
    ${fet ? '<span class="sfet" title="Feta">✓</span>' : prox ? '<span class="sprox">Pròxima</span>' : ''}</div>`;
  return sel
    ? `<div class="card srow selrow ${fet ? 'fet' : ''}" onclick="pick('${s.codi}')">${inner}</div>`
    : `<a class="card srow ${fet ? 'fet' : ''} ${prox ? 'prox' : ''}" href="#/s/${s.codi}">${inner}</a>`;
}

function fields(b) {
  return ['com', 'dosi', 'muntatge'].filter(k => b[k]).map(k =>
    `<div class="field">${k === 'com' ? '' : `<b>${LABEL[k]}</b>`}${esc(b[k])}</div>`).join('');
}

const MOTIU = { repetitiu: 'Repetitiu', altredia: 'Un altre dia', noviable: 'No viable' };
let nofEdit = null;   // {id, motiu, text} mentre s'omple el formulari de "no l'hem fet"

function blockCard(b, s, ord) {
  const id = `${s.codi}-${b.n}`, nf = NOF[id], ed = nofEdit?.id === id ? nofEdit : null;
  const nofHtml = nf && !ed
    ? `<div class="nofetbox"><b>No l'hem fet${nf.motiu ? ' ' + MOTIU[nf.motiu] : ''}</b>${nf.text ? `<div>${esc(nf.text)}</div>` : ''}</div>`
    : '';
  const form = ed ? `<div class="nofetbox"><b>Per què no l'heu fet?</b>
      <div class="motius">${Object.entries(MOTIU).map(([k, v]) => `<button class="${ed.motiu === k ? 'on' : ''}" onclick="nofMotiu('${k}')">${v}</button>`).join('')}</div>
      <input type="text" id="noftxt" placeholder="Comentari (opcional)" value="${esc(ed.text)}">
      <div class="actions"><button class="btn primary" onclick="nofSave('${s.codi}', ${b.n})">Desa</button><button class="btn" onclick="nofEdit=null;render()">Cancel·la</button></div></div>` : '';
  const fc = famC(b.codi);
  return `<div class="card block ${nf ? 'nofet' : ''} ${fc ? 'f-' + fc : ''}">
    <div class="bhead"><span class="bnum">${b.n ?? ''}</span><span class="btitle">${esc(b.titol)}</span>
      <span class="bmin">${b.min ?? ''} min<small>${esc(b.franja)}</small></span>
      ${ord ? `<span class="ord"><button ${ord.first ? 'disabled' : ''} onclick="moveBlock('${s.codi}', ${b.n}, -1)">▲</button><button ${ord.last ? 'disabled' : ''} onclick="moveBlock('${s.codi}', ${b.n}, 1)">▼</button></span>` : ''}</div>
    ${ord ? '' : `${b.codi ? `<div class="tags"><span class="code fam">${esc(b.codi)}</span>${fc ? ` <span class="meta">${FAM[fc]}</span>` : ''}</div>` : ''}
    ${fields(b)}
    ${b.lloc ? `<div class="field"><b>Lloc</b>${esc(b.lloc)}</div>` : ''}
    ${nofHtml}${form}`}
    ${ord ? '' : `<div class="bfoot">${b.min ? `<button class="chip" onclick="timerSet(${b.min}, '${esc((b.codi || b.titol).replace(/'/g, ''))}', true)">⏱ ${b.min} min</button>` : ''}
      ${CLAU && !ed ? (nf ? `<button class="small" onclick="nofDel('${id}')">Sí que l'hem fet</button>` : `<button class="small" onclick="nofOpen('${id}')">No l'hem fet</button>`) : ''}</div>`}
  </div>`;
}
window.nofOpen = id => { nofEdit = { id, motiu: '', text: '' }; render(); };
window.nofMotiu = k => { nofEdit.text = $('#noftxt')?.value || ''; nofEdit.motiu = k; render(); };
window.nofSave = (sc, n) => {
  const s = byCode(sc), b = s.blocs.find(x => x.n === n);
  fs.setDoc(ref('exercicis', nofEdit.id), { sessio: sc, n, codi: b.codi || '', titol: b.titol, motiu: nofEdit.motiu, text: ($('#noftxt')?.value || '').trim(), t: Date.now() });
  nofEdit = null; render();
};
window.nofDel = id => { fs.deleteDoc(ref('exercicis', id)); };
Object.defineProperty(window, 'nofEdit', { get: () => nofEdit, set: v => { nofEdit = v; } });

let toastT = null;
function desat(txt = '✓ Desat') {
  const t = $('#toast'); if (!t) return;
  t.textContent = txt; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1300);
}
function festa() {
  // pluja de confeti groc, negre i blau quan una sessió queda feta
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#f5c518', '#14181f', '#2f7de1', '#ffffff', '#e8590c'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % cols.length]};--dx:${(Math.random() - .5) * 160}px;--rot:${Math.random() * 900 - 450}deg;animation-duration:${1.6 + Math.random() * 1.4}s;animation-delay:${Math.random() * .3}s`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 3500);
  }
}
// finestra amb el format de l'app (en lloc de confirm/alert del navegador)
function dialeg(text, { ok = "D'acord", cancel = 'Cancel·la', perill = false, sol = false, ico = '' } = {}) {
  return new Promise(res => {
    const d = $('#dlg');
    $('#dico').textContent = ico || (perill ? '🗑️' : sol ? 'ℹ️' : '❓');
    $('#dtxt').innerHTML = text;
    $('#dbtns').innerHTML = `${sol ? '' : `<button class="btn" data-v="0">${cancel}</button>`}<button class="btn ${perill ? 'danger-fill' : 'primary'}" data-v="1">${ok}</button>`;
    const tanca = v => { d.hidden = true; d.onclick = null; res(v); };
    d.onclick = e => { const b = e.target.closest('[data-v]'); if (b) tanca(b.dataset.v === '1'); else if (e.target === d) tanca(false); };
    d.hidden = false; capitalitza();
  });
}
window.dialeg = dialeg;
function viewEntra() {
  const inv = store.get('volei.invitacio', null);
  return `<div class="entra card">
    <svg class="ball" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" fill="#f5c518"/>${BALLP.map(d => `<path d="${d}"/>`).join('')}</svg>
    <h2>${inv ? 'T\'han convidat a un equip' : 'Benvingut!'}</h2>

    ${USR === undefined ? '<p class="meta">Connectant…</p>' : ''}</div>`;
}
const sensePermis = () => `<div class="card warn"><b>Encara no tens accés a aquest equip.</b><div class="meta">Demana a l'administrador que et convidi o que et doni permís. Has entrat com a ${esc(USR?.email || '')}.</div><div class="actions"><button class="btn" onclick="surt()">Canvia de compte</button></div></div>`;
const needKey = what => `<div class="card warn"><b>Falta la clau d'aquest mòbil.</b><div class="meta">Per ${what} obre una vegada l'enllaç amb la clau que et va passar Claude.</div></div>`;

// pròxim dia d'entreno d'una família (avui inclòs)
function properDia(f) {
  const ds = diesDe(f); if (!ds.length) return null;
  for (let i = 0; i < 7; i++) { const d = new Date(Date.now() + i * 864e5); if (ds.includes(d.getDay())) return { i, iso: d.toISOString().slice(0, 10) }; }
  return null;
}
const salutacio = () => { const h = new Date().getHours(); return h < 6 ? 'Bona nit' : h < 14 ? 'Bon dia' : h < 21 ? 'Bona tarda' : 'Bona nit'; };
function viewHome() {
  const hero = f => {
    const s = next(f), pd = properDia(f); if (!s || !pd) return '';
    const tot = D.sessions.filter(x => fam(x) === f).length, fetes = D.sessions.filter(x => fam(x) === f && isFet(x.codi)).length;
    const when = pd.i === 0 ? 'Avui' : pd.i === 1 ? 'Demà' : dataCa(pd.iso);
    const fams = [...new Set(s.blocs.filter(b => !b.tret).map(b => famC(b.codi)).filter(Boolean))];
    return `<a class="hero ${f === 'DJ' ? 'dj' : ''}" href="#/s/${s.codi}">
      <span class="when ${pd.i > 1 ? 'later' : ''}">${when}</span>
      <div class="kick">${famLabel(f)} ${PISTES[f]} ${s.min} min</div>
      <div class="t"><b>${s.codi}</b> ${esc(s.titol)}</div>
      <div class="dots">${fams.map(k => `<i class="f-${k}">${FAM[k]}</i>`).join('')}</div>
      <div class="prog"><span class="pb"><i style="width:${Math.round(100 * fetes / tot)}%"></i></span>${fetes} de ${tot} fetes</div></a>`;
  };
  // pròxims partits: «Dijous 5/11 20:00 Sant Pere Groc vs Aloges» (sempre el local primer)
  const prox = PAR.filter(p => !jugat(p));
  const nos = p => `<span class="nosn ${p.equip === 'G' ? 'g' : 'n'}">${esc(nomNostre(p))}</span>`;
  const linia = p => { const d = new Date(p.data + 'T12:00'), dia = d.toLocaleDateString('ca', { weekday: 'long' }), riv = `<span>${esc(p.rival || 'Rival?')}</span>`;
    return `<a class="pxl" href="#/p/${p.id}"><span class="pxd">${dia[0].toUpperCase() + dia.slice(1)} ${d.getDate()}/${d.getMonth() + 1}${p.hora ? ' ' + esc(p.hora) : ''} <span class="qd">${queden(p.data)}</span></span>
      <span class="pxt">${p.lloc === 'fora' ? riv + ' vs ' + nos(p) : nos(p) + ' vs ' + riv}</span></a>`; };
  return `<div class="hello"><h2>${salutacio()}! 👋</h2><span>${new Date().toLocaleDateString('ca', { weekday: 'long', day: 'numeric', month: 'long' })}</span></div>
  ${D.sessions.length ? '' : `<div class="card warn"><b>Aquest equip encara no té sessions.</b><div class="meta">Les prepararem amb Claude. L'assistència, els partits i la resta ja funcionen.</div></div>`}
  <div class="heros">${['DT', 'DJ'].map(f => [f, properDia(f)]).filter(([, d]) => d).sort((a, b) => a[1].i - b[1].i).map(([f]) => hero(f)).join('')}</div>
  ${CLAU ? `<div class="quick">
    <button onclick="goLlista()"><span class="qi">📋</span>Passar llista</button>
    <button onclick="timerToggle(true)"><span class="qi">⏱️</span>Cronòmetre</button>
    <a href="#/pissarra"><span class="qi">🏐</span>Pissarra</a></div>
  <h3>Pròxims partits</h3>
  <div class="card pxlist">${prox.map(linia).join('') || '<p class="meta" style="margin:0">Cap partit planificat. Afegeix-los a Partits.</p>'}
    ${prox.length ? `<div class="actions" style="margin:6px 0 8px"><button class="btn primary" style="flex:1" onclick="copiaPartits()">📋 Copia el text per al WhatsApp</button></div><div class="actions" style="margin:0 0 10px"><button class="btn" style="flex:1" onclick="copiaImatge()">🖼️ Copia imatge</button><button class="btn" style="flex:1" onclick="desaImatge()">⬇️ Desa imatge</button></div>` : ''}</div>`
  : needKey('marcar sessions, escriure comentaris i portar l\'assistència,')}
  <details class="card"><summary>Què volen dir els codis</summary>
  <div class="legend">${Object.entries(FAM).map(([k, v]) => `<span class="code fam f-${k}">${k}</span><span>${v}</span>`).join('')}</div></details>`;
}
// quant falta per a un partit: «Avui», «Demà», «Queden 3 dies», «Queden 2 setmanes»
function queden(data) {
  const d = Math.round((new Date(data + 'T12:00') - new Date(avui() + 'T12:00')) / 864e5);
  if (d <= 0) return 'Avui'; if (d === 1) return 'Demà';
  if (d < 7) return `Queden ${d} dies`;

async function dibuixaPartits() {

  const g = x.createLinearGradient(0, 0, W * .4, c.height); g.addColorStop(0, '#163a68'); g.addColorStop(1, '#08182c');
  x.fillStyle = g; x.fillRect(0, 0, W, c.height);
  x.strokeStyle = 'rgba(255,255,255,.05)'; x.lineWidth = 6;
  for (let k = -c.height; k < W; k += 90) { x.beginPath(); x.moveTo(k, 0); x.lineTo(k + c.height * .6, c.height); x.stroke(); }
  pilota(x, W - 120, 150, 230, .10);
  // capçalera

  x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  x.fillStyle = '#fff'; x.font = `800 112px ${F}`; x.fillText('PROPERS PARTITS', 205, 168);
  x.fillStyle = '#f5c518'; x.font = `700 40px ${F}`; x.fillText(((club() || 'Vòlei') + ' temporada ' + tempNom(TEMP)).toUpperCase(), 210, 222);
  x.fillStyle = '#f5c518'; x.fillRect(60, HEAD - 34, 140, 8);
  // un partit per fila
  // equips (el local primer); la mateixa mida de lletra a totes les files
  const parelles = p => { const nos = nomNostre(p).toUpperCase(), riv = (p.rival || 'Rival?').toUpperCase();
    return p.lloc === 'fora' ? [[riv, 0], ['VS', 2], [nos, 1]] : [[nos, 1], ['VS', 2], [riv, 0]]; };
  const fnt = (k, sz) => `${k === 2 ? 700 : 800} ${k === 2 ? sz * .55 : sz}px ${F}`;
  const ample = (parts, sz) => parts.reduce((t, [txt, k]) => { x.font = fnt(k, sz); return t + x.measureText(txt).width + (k === 1 ? 32 : 0) + (k === 2 ? 36 : 0); }, 0);
  let MIDA = 58; while (ps.some(p => ample(parelles(p), MIDA) > W - 120 - 250 - 30) && MIDA > 28) MIDA -= 2;
  ps.forEach((p, i) => {

    x.strokeStyle = 'rgba(255,255,255,.12)'; x.lineWidth = 2; rr(60, Y, W - 120, H, 28); x.stroke();

    x.textAlign = 'center'; x.fillStyle = '#14181f';
    x.font = `700 28px ${F}`; x.fillText(d.toLocaleDateString('ca', { weekday: 'short' }).replace('.', '').toUpperCase(), 135, Y + 44);
    x.font = `800 72px ${F}`; x.fillText(String(d.getDate()), 135, Y + 112);
    x.font = `700 26px ${F}`; x.fillText(d.toLocaleDateString('ca', { month: 'short' }).replace('.', '').toUpperCase(), 135, Y + 144);
    x.textAlign = 'left';
    // hora i lloc
    x.fillStyle = 'rgba(255,255,255,.7)'; x.font = `600 32px ${F}`;
    const dia = d.toLocaleDateString('ca', { weekday: 'long' });
    x.fillText(`${dia.toUpperCase()}${p.hora ? ' ' + p.hora : ''} ${p.lloc === 'fora' ? 'A FORA' : 'A CASA'}`, 250, Y + 56);
    // equips (el local primer); el nostre en una etiqueta del color de l'equip
    const parts = parelles(p), size = MIDA;
    let X = 250; const base = Y + 128;
    parts.forEach(([txt, k]) => {

        x.fillStyle = p.equip === 'G' ? '#f5c518' : '#000'; rr(X, base - size * .9, w + 32, size * 1.18, 12); x.fill();
        if (p.equip !== 'G') { x.strokeStyle = '#f5c518'; x.lineWidth = 3; rr(X, base - size * .9, w + 32, size * 1.18, 12); x.stroke(); }

// ------------------------------------------------------------- fitxa del jugador
const EQN = { N: 'Negre', G: 'Groc' };

const anell = (pct, lab) => `<div class="ring" style="--p:${pct ?? 0}"><div><b>${pct ?? '–'}${pct != null ? '%' : ''}</b><span>${lab}</span></div></div>`;

    <div class="meta" style="margin-top:6px">Cada quadre és un entreno, del més antic al més nou.</div></div>
  <details class="card"><summary>Veure tots els entrenos (${llistes.length})</summary>${llistes.map(a => { const e = a.estat[id], compta = e === 'si' || ve(j, a.data);
    return `<div class="hist"><span class="grow">${dataCa(a.data)} ${a.sessio ? `<span class="code">${a.sessio}</span>` : ''}${a.data > avui() ? ' <span class="tag">previst</span>' : ''}</span>
      <span class="est ${e}">${ESTI[e]} ${EST[e]}</span>${compta ? '' : '<span class="meta" title="No li toca venir aquest dia">no compta</span>'}</div>`; }).join('')}</details>`
  : '<div class="card"><p class="meta" style="margin:0">Cap llista encara.</p></div>'}
  <h3>Partits</h3>
  <div class="card">${ps.map(p => { const g = guany(p); return `<a class="hist nomlink" href="#/p/${p.id}"><span class="nos ${p.equip === 'G' ? 'g' : 'n'}">${p.equip === 'G' ? 'G' : 'N'}</span><span class="grow">${dataCa(p.data)} ${p.lloc === 'fora' ? 'a ' : 'vs '}${esc(p.rival || 'Partit')}</span>${p.resultat ? `<b class="res ${g}">${esc(p.resultat)}</b>` : ''}</a>`; }).join('') || '<p class="meta" style="margin:0">Encara no l\'has convocat a cap partit.</p>'}</div>
  ${(() => { const e = estadJug(PAR.flatMap(p => p.accions || []))[id]; return e ? `<h3>Estadístiques de partit</h3><div class="counts" style="justify-content:center">${Object.entries(e.n).map(([k, c]) => `<span class="est ${ACC[k].bo ? 'si' : 'no'}">${ACC[k].i} ${c} ${ACC[k].t.toLowerCase()}</span>`).join('')}</div><p class="meta" style="text-align:center">Balanç: <b>${e.bo - e.mal > 0 ? '+' : ''}${e.bo - e.mal}</b> (${e.bo} encerts, ${e.mal} errors)</p>` : ''; })()}

// ------------------------------------------------------------- partits
// el resultat s'escriu com sempre: primer el local. A fora, el primer número és el del rival.
const guany = p => { const m = /^(\d+)-(\d+)$/.exec(p.resultat || ''); if (!m) return ''; let [a, b] = [+m[1], +m[2]]; if (p.lloc === 'fora') [a, b] = [b, a]; return a > b ? 'guanyat' : a < b ? 'perdut' : ''; };
let parFiltre = store.get('volei.parfiltre', '');
let parVista = store.get('volei.parvista', 'llista'), calMes = null;   // calMes: 'AAAA-MM'
window.parVeure = v => { parVista = v; store.set('volei.parvista', v); render(); };
// Calendari: un mes per pàgina; es llisca a esquerra i dreta (Swiper, efecte cub, com al Buyte).
// Swiper es carrega només quan s'obre el calendari; sense connexió queden les fletxes.
let CALSW = null, CALMESOS = [], swiperCarregant = false;
const nomMes = ym => { const [y, m] = ym.split('-').map(Number), t = new Date(y, m - 1, 1).toLocaleDateString('ca', { month: 'long' }); return t[0].toUpperCase() + t.slice(1) + ' ' + y; };
const sumaMes = (ym, d) => { const [y, m] = ym.split('-').map(Number), t = new Date(y, m - 1 + d, 1); return `${t.getFullYear()}-${two(t.getMonth() + 1)}`; };
function carregaSwiper() {
  if (window.Swiper || swiperCarregant) return; swiperCarregant = true;
  const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css'; document.head.appendChild(l);
  const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js';
  sc.onload = () => render(); sc.onerror = () => { swiperCarregant = false; }; document.head.appendChild(sc);
}
function mesosTemporada(ps) {
  // de setembre a juliol de la temporada (26-27 -> 2026-09 .. 2027-07), més els mesos amb partits fora d'aquest marge
  const y0 = 2000 + (parseInt(TEMP) || new Date().getFullYear() % 100);
  let ini = `${y0}-09`, fi = `${y0 + 1}-07`;
  ps.forEach(p => { const ym = (p.data || '').slice(0, 7); if (!ym) return; if (ym < ini) ini = ym; if (ym > fi) fi = ym; });
  if (calMes < ini) ini = calMes; if (calMes > fi) fi = calMes;
  const out = []; for (let ym = ini; ym <= fi; ym = sumaMes(ym, 1)) out.push(ym);
  return out;
}
function mesHtml(ym, ps) {
  const [y, m] = ym.split('-').map(Number), first = new Date(y, m - 1, 1), dies = new Date(y, m, 0).getDate();
  const off = (first.getDay() + 6) % 7, cel = [];
  for (let i = 0; i < off; i++) cel.push('<div class="cd buit"></div>');
  for (let d = 1; d <= dies; d++) {
    const iso = `${ym}-${two(d)}`, dp = ps.filter(p => p.data === iso);
    cel.push(`<div class="cd ${iso === avui() ? 'avui' : ''} ${iso === calDia ? 'sel' : ''}" onclick="calToca('${iso}')"><span class="dn">${d}</span>${dp.map(p => `<span class="cp ${p.equip === 'G' ? 'eqG' : 'eqN'} ${guany(p)}" title="${EQN[p.equip] || ''}"><i>${p.lloc === 'fora' ? '🚌' : '🏠'}</i><span class="rv">${esc(p.rival || 'Partit')}</span>${p.hora ? `<span class="hr">${esc(p.hora)}</span>` : ''}</span>`).join('')}</div>`);
  }
  while (cel.length < 42) cel.push('<div class="cd buit"></div>');   // sempre 6 setmanes: totes les cares del cub fan la mateixa alçada
  return `<div class="cal">${['Dl', 'Dt', 'Dc', 'Dj', 'Dv', 'Ds', 'Dg'].map(d => `<div class="ch">${d}</div>`).join('')}${cel.join('')}</div>`;
}
function calendari(ps, card) {
  if (!calMes) { const f = ps.find(p => p.data >= avui()); calMes = (f ? f.data : avui()).slice(0, 7); }
  carregaSwiper();
  CALMESOS = window.Swiper ? mesosTemporada(ps) : [calMes];
  return `<div class="calnav"><button class="btn" onclick="calMou(-1)" aria-label="Mes anterior">‹</button><b id="calnom">${nomMes(calMes)}</b><button class="btn" onclick="calMou(1)" aria-label="Mes següent">›</button></div>
  ${window.Swiper ? `<div class="swiper calsw" id="calsw"><div class="swiper-wrapper">${CALMESOS.map(ym => `<div class="swiper-slide">${mesHtml(ym, ps)}</div>`).join('')}</div></div>` : mesHtml(calMes, ps)}
  <div class="callegend"><span style="flex-basis:100%;justify-content:center">${window.Swiper ? '👈 Llisca per canviar de mes 👉 ' : ''}Toca un partit per veure'l toca un dia buit per crear-ne un</span><span><i class="n"></i>Negre</span><span><i class="g"></i>Groc</span><span><i class="w"></i>Guanyat</span><span><i class="l"></i>Perdut</span><span>🏠 A casa</span><span>🚌 A fora</span></div>
  ${calDia && ps.some(p => p.data === calDia) ? `<div class="daypanel"><h3>${dataCa(calDia)}</h3>${ps.filter(p => p.data === calDia).map(card).join('')}
    <button class="btn" style="width:100%" onclick="newPartit('${calDia}')">+ Un altre partit aquest dia</button></div>` : ''}`;
}
function ajustaNoms() {
  // cap paraula del rival es parteix: si una no hi cap, es fa la lletra més petita
  document.querySelectorAll('.cp .rv').forEach(el => {
    el.style.fontSize = ''; let f = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > el.clientWidth + 1 && f > 7) { f -= .5; el.style.fontSize = f + 'px'; }
  });
}
addEventListener('resize', () => ajustaNoms());
function muntaCalendari() {
  // es crida després de cada render: el calendari es torna a pintar sencer
  ajustaNoms();
  try { CALSW?.destroy(true, false); } catch {}
  CALSW = null;
  const el = $('#calsw'); if (!el || !window.Swiper) return;
  CALSW = new Swiper(el, {
    effect: 'cube', grabCursor: true, initialSlide: Math.max(0, CALMESOS.indexOf(calMes)),

}
window.calMou = d => {

// tocar un dia amb partit en mostra la fitxa a sota; tocar un dia buit crea un partit aquell dia

window.calToca = iso => {

window.majuscula = el => { const v = el.value; if (v && v[0] !== v[0].toUpperCase()) el.value = v[0].toUpperCase() + v.slice(1); };

function viewPartits() {

  const ps = PAR.filter(p => !parFiltre || p.equip === parFiltre);

    const dt = new Date(p.data + 'T12:00'), g = guany(p), nos = `<span class="nos ${p.equip === 'G' ? 'g' : 'n'}">${esc(dosEq() ? EQN[p.equip] || '?' : club() || 'Nosaltres')}</span>`, riv = `<span>${esc(p.rival || 'Rival?')}</span>`;
    const dies = Math.round((dt - new Date(avui() + 'T12:00')) / 864e5);
    const falta = dies === 0 ? 'Avui!' : dies === 1 ? 'Demà' : `D'aquí ${dies} dies`;
    const parc = Object.keys(p.punts || {}).sort().map(k => { const [a, b] = p.punts[k]; if (a === '' || b === '') return ''; const w = (+a > +b) !== (p.lloc === 'fora'); return `<i class="${w ? 'w' : 'l'}">${a}-${b}</i>`; }).join('');

  if (jid) pos[z] = jid; else delete pos[z];

let DRAG = null;
document.addEventListener('pointerdown', e => {
  const t = e.target.closest('.tok'), c = t?.closest('.court'); if (!t || !c || t.classList.contains('lib')) return;
  e.preventDefault(); t.setPointerCapture(e.pointerId); t.classList.add('drag');
  DRAG = { t, c, r: c.getBoundingClientRect() };
});
document.addEventListener('pointermove', e => {
  if (!DRAG) return;
  const { t, r } = DRAG, x = Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100)), y = Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100));
  t.style.left = x + '%'; t.style.top = y + '%'; DRAG.x = x; DRAG.y = y;
});
document.addEventListener('pointerup', () => {
  if (!DRAG) return;
  const { t, c, x, y } = DRAG; DRAG = null; t.classList.remove('drag');
  if (x == null) return;
  const from = +t.dataset.z;
  if (c.dataset.mode === 'lineup') {
    const to = +Object.entries(ZONES).sort(([, a], [, b]) => Math.hypot(a[0] - x, a[1] - y) - Math.hypot(b[0] - x, b[1] - y))[0][0];
    const id = location.hash.split('/')[2], pos = { ...((PAR.find(q => q.id === id).sets || {})[setActiu] || {}) };
    const a = pos[from], b = pos[to]; if (a) pos[to] = a; else delete pos[to]; if (b) pos[from] = b; else delete pos[from];
    setPos(id, pos);
  } else {
    const st = pisEstat(); st.xy[t.dataset.z] = [x, y]; store.set(pisKey(), st);
  }
});

  const nom = $('#nougrup').value.trim(), cl = $('#nouclub').value.trim(), tp = $('#noutempg').value.trim();
  if (nom.length < 2 || /[\/\\'"`]/.test(nom + tp) || !tp) { await dialeg('Posa el nom de l\'equip i la temporada, sense barres ni cometes.', { sol: true }); return nouGrup({ nom, cl, tp }); }
  const g = 'g' + Date.now().toString(36), key = `${tp} · ${nom}`;
  if (CFG.temporades[key]) { dialeg('Aquest equip ja existeix en aquesta temporada.', { sol: true }); return; }
  await fs.setDoc(cfgRef(), { grups: { [g]: { nom, club: cl, nEq: 1 } }, temporades: { [key]: { nom: tp, grup: g, dies: {}, sessions: '' } } }, { merge: true });
  setTemp(key);
};
window.setTema = v => { store.set('volei.tema', v); tema(v); render(); };
window.setTemp = t => { TEMP = t; store.set('volei.temp', t); store.set('volei.temp.' + grupDe(t), t); openSeason(); };
window.setDia = (d, v) => {
  const dies = { ...tcfg().dies }; if (v) dies[d] = v; else delete dies[d];
  if (!Object.keys(dies).length && Object.keys(tcfg().dies).length) { dialeg('Com a mínim hi ha d\'haver un dia d\'entreno.', { sol: true }); return render(); }
  fs.updateDoc(cfgRef(), new fs.FieldPath('temporades', TEMP, 'dies'), dies);   // substitueix el mapa sencer (merge no esborraria dies)
};
window.newTemp = async () => {
  const t = $('#noutemp').value.trim();
  // el nom és l'identificador de la temporada a Firebase: tot permès menys / \ ' " ` i fins a 40 lletres
  if (t.length < 2 || t.length > 40 || /[\/\\'"`]/.test(t)) { dialeg('Posa un nom d\'entre 2 i 40 lletres, sense barres ni cometes. Per exemple: 26-27 masculí infantil.', { sol: true }); return; }
  const g = grupDe(TEMP), key = g === GP ? t : `${t} · ${gcfg().nom}`;
  if (CFG.temporades[key]) { dialeg('Aquesta temporada ja existeix.', { sol: true }); return; }
  if (!await dialeg(`Crear la temporada <b>${esc(t)}</b>?`, { ok: 'Crea-la', ico: '🏐' })) return;
  const nova = { ...tcfg(), nom: t, grup: g }, equip = JUG.filter(j => j.actiu !== false);
  const ant = TEMP; TEMP = key;
  await Promise.all(equip.map(j => { const { id, ...dades } = j; return fs.setDoc(ref('jugadors', id), dades); }));
  TEMP = ant;
  await fs.setDoc(cfgRef(), { ...(g === GP ? { actual: key } : {}), temporades: { [key]: nova } }, { merge: true });
  setTemp(key);
};

// ---------------------------------------------------------------- cronòmetre
// Compte enrere (dur > 0) o cronòmetre (dur = 0). Continua encara que canviïs de pantalla.
// L'alarma és un fitxer d'àudio que es reprodueix des del principi: silenci fins al final del
// compte enrere i després l'alarma. Com que és àudio normal, sona encara que bloquegis el mòbil.
const T = { dur: 0, start: 0, acc: 0, run: false, lab: '', beeped: false, tick: null };
const two = n => String(n).padStart(2, '0');
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return two(Math.floor(s / 60)) + ':' + two(s % 60); };
const elapsed = () => T.acc + (T.run ? Date.now() - T.start : 0);
const PLAYER = new Audio(); PLAYER.preload = 'auto';
let AUDIO_URL = null, AC = null, ALARM = null;

function wav(silenceSec) {
  // WAV 8 bits, 8 kHz: silenci + 15 segons d'alarma (4 xiulets aguts cada 1,1 s)
  const R = 8000, alarm = 15, n = Math.round((silenceSec + alarm) * R), buf = new Uint8Array(44 + n), v = new DataView(buf.buffer);
  const str = (o, t) => [...t].forEach((c, i) => buf[o + i] = c.charCodeAt(0));
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, R, true); v.setUint32(28, R, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, 'data'); v.setUint32(40, n, true);
  buf.fill(128, 44);
  const s0 = Math.round(silenceSec * R);
  for (let i = s0; i < n; i++) {
    const t = (i - s0) / R, c = t % 1.1, k = Math.floor(c / .18);
    if (k < 4 && c - k * .18 < .13) { const f = k % 2 ? 2600 : 2000; buf[44 + i] = ((i * f / R) % 1) < .5 ? 250 : 6; }
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function audioArm() {
  // es crida en prémer Comença (els mòbils només deixen sonar àudio que surt d'un toc)
  if (AUDIO_URL) URL.revokeObjectURL(AUDIO_URL);
  AUDIO_URL = wav(Math.max(0, (T.dur - elapsed()) / 1000));
  PLAYER.src = AUDIO_URL; PLAYER.currentTime = 0;
  PLAYER.play().catch(() => {});
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: T.lab || 'Compte enrere', artist: gcfg().nom + ' ' + tempNom(TEMP) });
    navigator.mediaSession.setActionHandler('pause', () => { if (T.run) timerGo(); });
    navigator.mediaSession.setActionHandler('stop', () => alarmStop());
  }
}
function webBeepFallback() {
  // per si el fitxer no ha pogut sonar: xiulets amb WebAudio mentre l'app és oberta
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume();
    const go = () => { const t0 = AC.currentTime; [0, .18, .36, .54].forEach((d, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = i % 2 ? 2600 : 2000; g.gain.value = 1; o.connect(g); g.connect(AC.destination); o.start(t0 + d); o.stop(t0 + d + .13); }); };
    go(); ALARM = setInterval(go, 1100); setTimeout(alarmStop, 15000);
  } catch {}
}
function alarmStart() {
  const ok = !PLAYER.paused && PLAYER.currentTime > 0;
  if (!ok) webBeepFallback();
  try { navigator.vibrate?.([500, 200, 500, 200, 500, 200, 500]); } catch {}
  $('#tstop').hidden = false;
  timerToggle(true);
}
window.alarmStop = () => {
  PLAYER.pause(); clearInterval(ALARM); ALARM = null;
  try { navigator.vibrate?.(0); } catch {}
  $('#tstop').hidden = true;
  if (T.dur && T.run && T.dur - elapsed() <= 0) { T.run = false; T.acc = T.dur; clearInterval(T.tick); timerPaint(); }
};
function timerPaint() {
  const e = elapsed(), left = T.dur - e, end = T.dur && left <= 0, dig = $('#tdig');
  const show = T.run || e ? (T.dur ? fmt(Math.abs(left)) : fmt(e)) : (T.dur ? fmt(T.dur) : '00:00');
  const [mm, ss] = show.split(':');
  if (document.activeElement !== $('#tm')) { $('#tm').value = (end ? '-' : '') + mm; $('#tm').style.width = ($('#tm').value.length + .3) + 'ch'; }
  if (document.activeElement !== $('#ts')) $('#ts').value = ss;
  $('#tm').readOnly = $('#ts').readOnly = T.run;
  $('#thint').hidden = T.run;
  dig.classList.toggle('end', !!end);
  $('#tlab').textContent = T.lab;
  $('#tgo').textContent = T.run ? '⏸ Pausa' : (e ? '▶ Continua' : '▶ Comença');
  $('#tbtn').classList.toggle('run', T.run);
  const mini = $('#tmini'); mini.hidden = !$('#timer').hidden || !(T.run || end); mini.textContent = '⏱ ' + (end ? '-' : '') + show; mini.classList.toggle('end', !!end);
  if (end && !T.beeped) { T.beeped = true; alarmStart(); }
  // rodes: només abans de començar; segueixen el valor triat amb els números o els botons
  const rd = $('#trodes'); rd.hidden = T.run || !!e;
  if (!rd.hidden && !rodaTocant) { posaRoda('#trm', Math.floor(T.dur / 60000)); posaRoda('#trs', Math.round(T.dur / 1000) % 60); }
}
// rodes del compte enrere (minuts 0-60, segons 0-59): en deixar de lliscar, el valor passa al cronòmetre
let rodaTocant = false, rodaProg = 0, rodaT = null;
['#trm', '#trs'].forEach((sel, k) => {
  const el = $(sel); el.innerHTML = '<i></i><i></i>' + Array.from({ length: k ? 60 : 61 }, (_, x) => `<span>${two(x)}</span>`).join('') + '<i></i><i></i>';
  el.addEventListener('scroll', () => {
    if (Date.now() < rodaProg) return;
    rodaTocant = true; clearTimeout(rodaT);
    rodaT = setTimeout(() => {
      rodaTocant = false;
      const m = Math.round($('#trm').scrollTop / 40), sc = Math.round($('#trs').scrollTop / 40);
      if (m * 60000 + sc * 1000 !== T.dur) timerSet((m * 60 + sc) / 60, m || sc ? '' : 'Cronòmetre');
    }, 180);
  });
});
function posaRoda(sel, v) { const el = $(sel); if (Math.round(el.scrollTop / 40) !== v) { rodaProg = Date.now() + 250; el.scrollTop = v * 40; } }
window.timerEdit = () => {
  const m = Math.max(0, parseInt($('#tm').value.replace('-', '')) || 0), sc = Math.min(59, Math.max(0, parseInt($('#ts').value) || 0));
  timerSet((m * 60 + sc) / 60, m || sc ? '' : 'Cronòmetre');
};
window.timerToggle = show => {
  const el = $('#timer'), v = show ?? el.hidden; el.hidden = !v; timerPaint();
};
window.timerSet = (min, lab, go) => {
  alarmStop(); PLAYER.removeAttribute('src');
  T.dur = Math.round(min * 60000); T.acc = 0; T.run = false; T.beeped = false; clearInterval(T.tick);
  T.lab = lab || (min ? 'Compte enrere' : 'Cronòmetre');
  timerToggle(true); if (go) timerGo(); else timerPaint();
};
window.timerGo = () => {
  if (T.run) { T.acc = elapsed(); T.run = false; clearInterval(T.tick); PLAYER.pause(); }
  else {
    if (T.dur && T.dur - elapsed() <= 0) { T.acc = 0; T.beeped = false; }   // tornar a començar un compte acabat
    T.start = Date.now(); T.run = true; T.tick = setInterval(timerPaint, 250);
    if (T.dur) audioArm();
  }
  timerPaint();
};
window.timerReset = () => { alarmStop(); T.acc = 0; T.beeped = false; if (T.run) { T.start = Date.now(); if (T.dur) audioArm(); } timerPaint(); };

// ------------------------------------------------------------------- render
// tot el que s'escriu comença en majúscula; als noms de jugador (data-cap="w"), cada paraula
function majuscules(el) {
  const v = el.value, n = el.dataset.cap === 'w' ? v.replace(/(^|\s)(\p{Ll})/gu, (m, a, b) => a + b.toUpperCase()) : v.replace(/^(\s*)(\p{Ll})/u, (m, a, b) => a + b.toUpperCase());
  if (n === v) return;
  const a = el.selectionStart, b = el.selectionEnd; el.value = n; try { el.setSelectionRange(a, b); } catch {}
}
document.addEventListener('input', e => { if (e.target.matches?.('input[type=text], textarea') && e.target.id !== 'noutemp' && e.target.id !== 'noutempg') majuscules(e.target); });
const capitalitza = () => document.querySelectorAll('input[type=text], textarea').forEach(el => { el.autocapitalize = el.dataset.cap === 'w' ? 'words' : 'sentences'; });
let lastRuta = null;
// errors: no deixen l'app en blanc i es guarden a /errors perquè Claude els pugui mirar
let errVists = new Set();
function registraError(e, on) {
  const msg = String(e?.message || e || 'error'), clau = msg + on;
  console.error(e); if (errVists.has(clau) || !db || !CLAU) return; errVists.add(clau);
  try { fs.addDoc(fs.collection(db, 'equips', CLAU, 'errors'), { t: Date.now(), msg: msg.slice(0, 300), stack: String(e?.stack || '').slice(0, 1500), on: on || '', ruta: location.hash.slice(0, 80), temporada: TEMP, ua: navigator.userAgent.slice(0, 160) }); } catch {}
}
addEventListener('error', e => registraError(e.error || e.message, 'global'));
addEventListener('unhandledrejection', e => registraError(e.reason, 'promesa'));
function render() {
  try { pintaPantalla(); }
  catch (e) {
    registraError(e, 'render');
    $('#app').innerHTML = `<div class="card warn"><b>Aquesta pantalla ha fallat.</b><div class="meta">L'error s'ha guardat perquè Claude el pugui mirar i arreglar.</div><div class="meta" style="font-size:12px">${esc(e?.message || e)}</div>
      <div class="actions"><a class="btn primary" href="#/">Torna a l'inici</a><button class="btn" onclick="location.reload()">Torna a carregar</button></div></div>`;
  }
}
function pintaPantalla() {
  if (!D) return;
  let [r, arg] = location.hash.replace(/^#\/?/, '').split('/');
  if (r === 'dimarts') { r = 'f'; arg = 'DT'; } else if (r === 'dijous') { r = 'f'; arg = 'DJ'; }   // enllaços antics
  let html, tab = 'inici', title = (Object.keys(grups()).length > 1 ? gcfg().nom : 'Vòlei') + ' ' + tempNom(TEMP);
  // sense equip, o amb una invitació per acceptar i sense compte: pantalla d'entrada
  if (r !== 'config' && (!CLAU || (store.get('volei.invitacio', null) && !USR))) { html = viewEntra(); title = 'Vòlei'; }
  else if (USR && MEM && !rolActual() && r !== 'config') { html = sensePermis(); }
  else if (r === 's') { html = viewSession(arg); tab = byCode(arg) ? fam(byCode(arg)) : ''; title = arg; }
  else if (r === 'f') { html = viewList(arg); tab = arg; }
  else if (r === 'assistencia') { html = viewAssistencia(); tab = 'assistencia'; title = 'Assistència'; }
  else if (r === 'config') { html = viewConfig(); tab = ''; title = 'Configuració'; }
  else if (r === 'j') { html = viewJugador(arg); tab = 'assistencia'; title = 'Jugador'; }
  else if (r === 'partits') { html = viewPartits(); tab = 'partits'; title = 'Partits'; }
  else if (r === 'p') { html = viewPartit(arg); tab = 'partits'; title = 'Partit'; }
  else if (r === 'pissarra') { html = viewPissarra(arg); tab = 'partits'; title = 'Pissarra'; }
  else if (r === 'directe') { html = viewDirecte(arg); tab = 'partits'; title = 'En directe'; }
  else html = viewHome();
  $('#tabs').innerHTML = `<a href="#/" data-t="inici"><span class="ico">${ICO.inici}</span>Inici</a>
    ${['DT', 'DJ'].filter(f => diesDe(f).length).map(f => `<a href="#/f/${f}" data-t="${f}"><span class="ico">${f === 'DT' ? ICO.pista : ICO.pistes}</span>${diesDe(f).map(d => CURT[d]).join('+') === 'Dt' ? 'Dimarts' : diesDe(f).map(d => CURT[d]).join('+') === 'Dj' ? 'Dijous' : diesDe(f).length === 1 ? DIES[diesDe(f)[0]] : diesDe(f).map(d => CURT[d]).join(' + ')}</a>`).join('')}
    <a href="#/assistencia" data-t="assistencia"><span class="ico">${ICO.ass}</span>Assistència</a>
    <a href="#/partits" data-t="partits"><span class="ico">${ICO.partits}</span>Partits</a>`;
  // no repintar mentre s'escriu un comentari
  const a = document.activeElement;
  if (a && (a.id === 'com' || a.id === 'nounom' || a.id === 'noftxt' || a.id === 'noutemp' || a.id === 'club' || a.id === 'gnom' || a.id === 'nougrup' || a.id === 'nouclub' || a.id === 'noutempg' || a.id === 'rival' || /^p[ab]\d$/.test(a.id) || (a.type === 'text' && a.closest('.edit-pl'))) && $('#app').contains(a)) return;
  $('#app').innerHTML = html;
  const ruta = r + '/' + arg;
  muntaCalendari(); capitalitza();
  document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px');   // per al marcador fix del directe
  if (ruta !== lastRuta) { lastRuta = ruta; const ap = $('#app'); ap.classList.remove('view'); void ap.offsetWidth; ap.classList.add('view'); }
  $('#title').textContent = title;
  $('#back').hidden = !['s', 'config', 'j', 'p', 'pissarra', 'directe'].includes(r);
  document.querySelectorAll('nav.tabs a').forEach(x => x.classList.toggle('on', x.dataset.t === tab));
}
window.render = render;
Object.defineProperty(window, 'editEquip', { get: () => editEquip, set: v => { editEquip = v; } });
Object.defineProperty(window, 'editAss', { get: () => editAss, set: v => { editAss = v; } });

$('#back').onclick = () => history.length > 1 ? history.back() : (location.hash = '#/');
addEventListener('hashchange', () => { const mi = location.hash.match(/^#\/uneix\/([A-Za-z0-9]{24,})\/([A-Za-z0-9]{12,})/); if (mi) { store.set('volei.invitacio', { clau: mi[1], codi: mi[2] }); if (USR) quiSoc(); } sel = null; convDesfes = null; editAss = null; nofEdit = null; ordering = false; editEquip = false; if (!/^#\/(p|pissarra|directe)\//.test(location.hash)) setActiu = 1; dirJug = null; tancaFitxa(); render(); scrollTo(0, 0); });
TEMP = TEMP || CFG.actual;
fetch(tcfg().sessions, { cache: 'no-cache' }).then(r => r.json())
  .then(d => { D = d; D.__file = tcfg().sessions; render(); initFirebase(); })
  .catch(() => { $('#app').innerHTML = '<p class="empty">No s\'han pogut carregar les sessions. Comprova la connexió.</p>'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
