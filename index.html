<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tres Tocs</title>

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
:root {
  --bg: #f1f3f8; --card: #ffffff; --ink: #14202e; --muted: #5d6a7c; --line: #e1e6ee;
  --brand: #14325a; --brand-soft: #e5edf8; --accent: #f5c518; --accent-ink: #14202e;
  --si: #17864b; --si-soft: #e1f5e9; --avisa: #6b7480; --avisa-soft: #eef0f3; --no: #c8322a; --no-soft: #fde7e5;
  --shadow: 0 1px 2px rgba(20,32,46,.06), 0 4px 14px rgba(20,32,46,.06);
  --head: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  /* un color per família d'exercicis */
  --f-D: #2f7de1; --f-B: #12a07c; --f-S: #8b5cf6; --f-R: #e8590c; --f-BL: #d6336c; --f-C: #0b9fbd; --f-J: #4c5fd5; --f-G: #e09a00; --f-A: #6b7280;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1219; --card: #161e29; --ink: #e8edf3; --muted: #9aa7b6; --line: #263241;
    --brand: #8cbcf0; --brand-soft: #1a2c42; --accent: #f5c518; --accent-ink: #14202e;
    --si: #6cd39a; --si-soft: #14301f; --avisa: #9aa7b6; --avisa-soft: #1f2731; --no: #ff7b72; --no-soft: #3a1a18;
    --shadow: none;
    --f-D: #6aa8f5; --f-B: #3fd1a8; --f-S: #b197fc; --f-R: #ff8c4a; --f-BL: #f06595; --f-C: #3bc9db; --f-J: #8c9bff; --f-G: #ffc14d; --f-A: #9ca3af;
  }
}
:root[data-theme="dark"] {
    --bg: #0d1219; --card: #161e29; --ink: #e8edf3; --muted: #9aa7b6; --line: #263241;
    --brand: #8cbcf0; --brand-soft: #1a2c42; --accent: #f5c518; --accent-ink: #14202e;
    --si: #6cd39a; --si-soft: #14301f; --avisa: #9aa7b6; --avisa-soft: #1f2731; --no: #ff7b72; --no-soft: #3a1a18;
    --shadow: none;
    --f-D: #6aa8f5; --f-B: #3fd1a8; --f-S: #b197fc; --f-R: #ff8c4a; --f-BL: #f06595; --f-C: #3bc9db; --f-J: #8c9bff; --f-G: #ffc14d; --f-A: #9ca3af;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-feature-settings: 'locl' 0 !important; }   /* sense 'locl', la l·l de la Barlow es veu bé */
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.5 Barlow, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 80px; }
header { position: sticky; top: 0; z-index: 5; background: linear-gradient(120deg, #14325a 0%, #0c2340 70%); color: #fff; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 8px; box-shadow: inset 0 -4px 0 var(--accent); overflow: hidden; }
header::after { content: ''; position: absolute; right: -26px; top: -30px; width: 110px; height: 110px; border-radius: 50%; border: 10px solid rgba(255,255,255,.06); box-shadow: inset 18px 0 0 -8px rgba(255,255,255,.05); pointer-events: none; }
header h1 { font: 800 22px/1.1 var(--head); text-transform: uppercase; letter-spacing: .03em; margin: 0; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header h1 .ball { flex: none; width: 30px; height: 30px; }
header button { background: rgba(255,255,255,.1); border: 0; color: #fff; font-size: 20px; width: 40px; height: 40px; border-radius: 12px; padding: 0; cursor: pointer; display: grid; place-items: center; position: relative; z-index: 1; }
header button:active { background: rgba(255,255,255,.22); }
header button[hidden] { display: none; }
header #tbtn.run { background: var(--accent); color: var(--accent-ink); }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
nav.tabs[hidden] { display: none; }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--card); border-top: 1px solid var(--line); padding: 4px 4px env(safe-area-inset-bottom); z-index: 5; box-shadow: 0 -4px 18px rgba(20,32,46,.07); }
nav.tabs a { flex: 1; min-width: 0; text-align: center; padding: 6px 1px 8px; color: var(--muted); text-decoration: none; font-size: 11px; letter-spacing: -.01em; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs a .ico { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 15px; transition: background .2s; }
nav.tabs a .ico svg { width: 22px; height: 22px; }
nav.tabs a.on { color: var(--brand); }
nav.tabs a.on .ico { background: var(--brand-soft); }
h2 { font: 800 26px/1.15 var(--head); margin: 4px 0 12px; letter-spacing: .01em; }
h3 { font: 700 15px/1.2 var(--head); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 24px 0 8px; display: flex; align-items: center; gap: 8px; }
h3::before { content: ''; width: 14px; height: 4px; border-radius: 2px; background: var(--accent); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
a.card { display: block; color: inherit; text-decoration: none; }
.next { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .next { grid-template-columns: 1fr; } }
.next .card { border-left: 4px solid var(--brand); }
.kicker { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.big { font-size: 18px; font-weight: 650; margin-top: 2px; }
.meta { color: var(--muted); font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.row .grow { flex: 1; min-width: 0; }
.code { font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--brand); }
.list a.card, .list .card { padding: 11px 14px; }
.list .fet { opacity: .55; }
.tag { display: inline-block; font-size: 12px; font-weight: 650; border-radius: 6px; padding: 1px 7px; border: 1px solid currentColor; white-space: nowrap; color: var(--muted); }
.note { font-style: italic; color: var(--muted); margin: 6px 0 14px; }
.block { border-left: 5px solid var(--fc, var(--line)); }
.bhead { display: flex; gap: 10px; align-items: baseline; }
.bnum { flex: none; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--fc, var(--brand)); color: #fff; font: 800 17px/1 var(--head); align-self: center; }
.btitle { flex: 1; font-weight: 650; font-size: 17px; }
.bmin { text-align: right; white-space: nowrap; font: 700 18px/1.1 var(--head); color: var(--brand); }
.bmin small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.tags { margin: 6px 0 4px 40px; }
.field { margin: 8px 0 0 40px; }
.field b { color: var(--brand); font-size: 13px; text-transform: uppercase; letter-spacing: .03em; display: block; }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
a.btn { display: inline-block; text-decoration: none; text-align: center; }
button.btn, a.btn { font: inherit; font-size: 15px; font-weight: 600; border-radius: 12px; padding: 9px 14px; min-height: 42px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; transition: transform .08s; }
button.btn:active, a.btn:active, .tri button:active, .seg button:active { transform: scale(.96); }
button.btn.primary, a.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.btn.primary { color: #0f141a; } }
:root[data-theme="dark"] button.btn.primary { color: #0f141a; }
button.btn:disabled { opacity: .45; }
button.btn.danger { color: var(--no); }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.empty { color: var(--muted); text-align: center; padding: 30px 0; }
textarea, input[type=text], input[type=search], input[type=url], input[type=date], input[type=number], select { width: 100%; font: 16px/1.45 Barlow, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 9px 10px; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: -1px; }
textarea { min-height: 110px; }
.rcourt { max-width: 340px; margin: 14px auto 10px; } .rcourt .l3 { position: absolute; left: 0; right: 0; top: 33.3%; border-top: 2px solid rgba(255,255,255,.7); }
.rcourt .rtok { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; min-width: 54px; padding: 3px 6px; border-radius: 10px; background: #fff; color: #111; box-shadow: 0 2px 6px rgba(0,0,0,.3); font-size: 12px; line-height: 1.1; touch-action: none; }
.rcourt[data-edit] .rtok { cursor: grab; } .rcourt .rtok small { font-size: 10px; color: #666; } .rcourt .rtok.malrot { outline: 3px solid #e03131; }
.recdir summary { cursor: pointer; } .recdir .rcourt { max-width: 300px; }
.rcourt .rtok { border: 3px solid var(--pc, #fff); } .rlleg { display: inline-block; padding: 1px 6px; border-radius: 6px; border: 2px solid var(--pc); font-size: 11px; margin: 2px; } .rlleg.ps-col { --pc: #8b5cf6; } .rlleg.ps-op { --pc: #e8590c; } .rlleg.ps-rec { --pc: #12a07c; } .rlleg.ps-cen { --pc: #2f7de1; } .rlleg.ps-lli { --pc: #d9a90f; } .rcourt .rtok.ps-col { --pc: #8b5cf6; background: #efe7ff; } .rcourt .rtok.ps-op { --pc: #e8590c; background: #ffeadd; }
.rcourt .rtok.ps-rec { --pc: #12a07c; background: #dcf5ec; } .rcourt .rtok.ps-cen { --pc: #2f7de1; background: #e1edfc; } .rcourt .rtok.ps-lli { --pc: #d9a90f; background: #fff3c4; }
.btn.compartida { color: var(--si); border-color: var(--si); background: var(--si-soft); }
.modchk { display: flex; align-items: center; gap: 8px; margin: 2px 2px 10px; font-weight: 600; } .modchk input { width: 18px; height: 18px; } .modchk .meta { font-weight: 400; }
.avisos { border-left: 4px solid #e8a33d; } .avisos ul { margin: 6px 0 0; padding-left: 18px; } .avisos li { margin: 3px 0; }
.pills .warnp { color: #c0392b; border-color: #c0392b; }
.abib { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; } .abib select { width: auto; flex: 1; min-width: 140px; padding: 6px 8px; }
.famchk { display: flex; align-items: center; gap: 10px; margin: 8px 0; white-space: nowrap; } .famchk input { width: 18px; height: 18px; flex: none; } .famchk .code { min-width: 30px; text-align: center; }
.selbar.tres { gap: 6px; } .selbar.tres > .btn { flex: 1; padding: 9px 6px; text-align: center; text-decoration: none; white-space: nowrap; font-size: 14px; }
.durbar { padding: 10px 14px; } .durbar.be { color: var(--si); } .durbar.mal { color: #c0392b; }
.sesed .btitle input { width: 100%; font: inherit; font-weight: 700; } .sesed .ord button { min-width: 32px; }
.llses { margin: 4px 0 10px; } .llses > summary { cursor: pointer; margin-bottom: 8px; }
.bibfil { margin: 10px 0; } .bibfil > summary { list-style: none; display: inline-block; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 14px; cursor: pointer; } .bibfil > summary::-webkit-details-marker { display: none; }
.comfi textarea { min-height: 48px; transition: min-height .2s; } .comfi textarea:focus { min-height: 100px; } .comfi .actions { margin-top: 8px; } .comfi .ok { color: var(--si); }
label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 10px 0 4px; }
.selbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.selbar .grow { flex: 1; color: var(--muted); font-size: 14px; }
.selbar.bottom { position: fixed; left: 0; right: 0; bottom: 64px; margin: 0; padding: 10px 16px; background: var(--card); border-top: 1px solid var(--line); z-index: 4; justify-content: center; }
.selrow { cursor: pointer; }
.chk { width: 20px; height: 20px; accent-color: var(--brand); }
.chkline { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.chkline input { width: 18px; height: 18px; accent-color: var(--brand); }
.comment .meta { margin-bottom: 4px; }
/* Assistència */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow); }
.stat b { display: block; font: 800 30px/1.1 var(--head); color: var(--brand); }
.stat span { font-size: 12px; color: var(--muted); }
.pl { display: flex; align-items: center; gap: 6px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.pl:last-child { border-bottom: 0; }
.pl .nom { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; }
.pl .nom > a, .pl .nom .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pl .av { width: 28px; height: 28px; font-size: 12px; }
.pl .nom.no { color: var(--no); }
.tri { display: flex; gap: 4px; }
.tri { gap: 3px; }
.tri button { font: inherit; font-size: 15px; line-height: 1; border-radius: 9px; width: 38px; height: 34px; padding: 0; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; filter: grayscale(1); opacity: .35; }
.tri button.on { filter: none; opacity: 1; border-width: 2px; }
.tri button.on.si { background: var(--si-soft); border-color: var(--si); color: var(--si); }
.tri button.on.avisa { background: var(--avisa-soft); border-color: var(--avisa); color: var(--ink); }
.tri button.on.no { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; width: 70px; }
.bar i { display: block; height: 100%; background: var(--si); }
.pct.mes { width: 50px; color: var(--muted); }
.pct.mes.baixa { color: var(--no); }
.phead { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 0; }
.phead .pct { font-weight: 600; }
.pl .pct:not(.mes) { width: 50px; }
.pct { width: 44px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.red { color: var(--no); font-weight: 700; }
.warn { border-left: 4px solid var(--no); }
/* Cronòmetre */
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(8,14,24,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: grid; place-items: center; padding: 16px; animation: fade .15s ease-out; }
.modal[hidden] { display: none; }
.mbox { width: 100%; max-width: 380px; background: var(--card); border-radius: 22px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.35); animation: pop .2s ease-out; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.92); opacity: 0; } }
.dico { font-size: 34px; text-align: center; line-height: 1; margin-bottom: 8px; }
.dtxt { text-align: center; font-size: 17px; line-height: 1.4; margin-bottom: 18px; }
.dtxt small { color: var(--muted); font-size: 14px; }
.dbtns { display: flex; gap: 8px; }
.dbtns .btn { flex: 1; min-height: 46px; }
button.btn.danger-fill { background: var(--no); border-color: var(--no); color: #fff; }
.tbox { border-top: 6px solid var(--accent); }
.thead { display: flex; align-items: center; justify-content: space-between; font: 800 18px/1 var(--head); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.thead .tx { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--bg); color: var(--ink); font-size: 16px; cursor: pointer; }
#timer .digits { font: 800 84px/1 var(--head); text-align: center; font-variant-numeric: tabular-nums; letter-spacing: .02em; margin: 6px 0; }
#timer .digits input { font: inherit; color: inherit; width: 2.3ch; text-align: center; border: 0; border-bottom: 2px dashed var(--line); background: transparent; padding: 0; }
#timer .digits input:focus { outline: none; border-bottom-color: var(--brand); }
#timer .hint { text-align: center; font-size: 12px; color: var(--muted); }
#timer .digits.end { color: var(--no); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .3; } }
#timer .lab { text-align: center; color: var(--muted); font-size: 13px; min-height: 18px; }
#timer .actions { justify-content: center; margin-top: 8px; }
#timer .presets { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
#timer .presets button { font: inherit; font-size: 13px; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
#tmini { position: fixed; right: 14px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 7; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--accent); color: var(--accent-ink); font: 800 20px/1 var(--head); box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer; font-variant-numeric: tabular-nums; }
#tmini[hidden] { display: none; }
#tmini.end { background: var(--no); color: #fff; animation: blink 1s steps(2) infinite; }
#tstop { display: block; width: 100%; padding: 14px; margin-bottom: 8px; font-size: 18px; background: var(--no); border-color: var(--no); color: #fff; }
#tstop[hidden] { display: none; }
.chip { font: inherit; font-size: 14px; font-weight: 650; border-radius: 999px; padding: 6px 12px; border: 1px solid var(--brand); background: var(--brand-soft); color: var(--brand); cursor: pointer; }
/* Exercici no fet */
.block.nofet { opacity: .75; border-left-color: var(--no); }
.nofetbox { margin: 10px 0 0 40px; padding: 8px 10px; border-radius: 8px; background: var(--no-soft); font-size: 14px; }
.motius { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.motius button { font: inherit; font-size: 13px; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
.motius button.on { border-color: var(--no); color: var(--no); background: var(--no-soft); font-weight: 650; }
.bfoot { display: flex; gap: 8px; margin: 12px 0 0 40px; flex-wrap: wrap; }
button.small { font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 6px 12px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
/* Equip */
.edit-pl { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.edit-pl input[type=text] { flex: 1; min-width: 120px; }
.edit-pl label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.inactiu { opacity: .55; }
.dd { display: flex; gap: 3px; flex: none; }
.dd button { font: inherit; font-size: 12px; font-weight: 700; width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; padding: 0; }
.dd button.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.cfgday { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.cfgday:last-child { border-bottom: 0; }
.cfgday span { flex: 1; font-weight: 600; }
.cfgday select { width: auto; }
/* Jugador */
a.nomlink { color: inherit; text-decoration: none; }
.hist { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.hist:last-child { border-bottom: 0; }
.hist .grow { flex: 1; }
.est { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px; }
.est.si { background: var(--si-soft); color: var(--si); }
.est.avisa { background: var(--avisa-soft); color: var(--ink); }
.est.no { background: var(--no-soft); color: var(--no); }
/* Partits */
.seg { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.seg button { flex: 1; font: inherit; font-size: 15px; font-weight: 600; border-radius: 12px; padding: 8px; min-height: 40px; border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer; }
.seg button.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.eqN { background: #17202b; color: #fff; border-color: #17202b; }
.eqG { background: #f2c230; color: #17202b; border-color: #d9a90f; }
.conv { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.conv:last-child { border-bottom: 0; }
.conv input { width: 20px; height: 20px; accent-color: var(--brand); }
.conv .grow { flex: 1; }
.sets { display: grid; gap: 6px; }

let FETS = {}, COMS = [], JUG = [], ASS = [], NOF = {}, ORD = {}, PAR = [], CAL = null, FOTOS = []; // dades de Firebase (NOF: exercicis no fets)
let UNSUB = [];
let fs = null, db = null;

const NOMES_COMPTES = true;
let auth = null, AM = null, USR = undefined, MEM = null, MEMBRES = [], unsubMem = [];
const ROLS = { admin: 'Administrador', entrenador: 'Entrenador', lector: 'Només mirar', familia: 'Família (partits i fotos)' };

const rolDe = g => USR ? (MEM?.rols || {})[g] || null : (CLAU && !NOMES_COMPTES ? 'admin' : null);
const rolActual = () => rolDe(grupDe(TEMP));
const esAdmin = () => !USR ? !!CLAU && !NOMES_COMPTES : Object.values(MEM?.rols || {}).includes('admin');
async function initFirebase() {
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js');
    const mod = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js');
    // cada escriptura avisa amb un «✓ Desat» petit (tot es desa sol); qui només mira no pot escriure dades de l'equip
    const avisa = f => (r, ...a) => {
      if (['lector', 'familia'].includes(rolActual()) && /\/(temporades|config)\b/.test(r?.path || '') && !/\/fotos\b/.test(r?.path || '')) { desat('👀 Només pots mirar'); return Promise.resolve(); }
      desat(); return f(r, ...a);
    };
    fs = { ...mod, setDoc: avisa(mod.setDoc), updateDoc: avisa(mod.updateDoc), addDoc: avisa(mod.addDoc), deleteDoc: avisa(mod.deleteDoc) };
    const app = initializeApp(FB);
    db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache() });
    try {
      AM = await import('https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js');

    if (CLAU && !NOMES_COMPTES) connecta();
    if (!auth) render();
  } catch (e) { console.error(e); }
}

}

async function quiSoc() {
  unsubMem.forEach(u => u()); unsubMem = []; MEM = null; MEMBRES = [];

  const inv = store.get('volei.invitacio', null);

async function acceptaInvitacio({ clau, codi }) {

  UNSUB.forEach(u => u()); UNSUB = []; UNSUB.__t = TEMP;
  if (D?.fs) { D.sessions = D.__json || []; D.fs = false; } sesEd = null;
  FETS = {}; COMS = []; JUG = []; ASS = []; NOF = {}; ORD = {}; PAR = []; CAL = null; PAR.__ok = false; FOTOS = [];
  // fotos/{id del fitxer de Drive}: {partit, per (uid), t}. Les pot penjar tothom de l'equip (també les famílies), cadascú al seu Drive
  UNSUB.push(fs.onSnapshot(col('fotos'), q => { FOTOS = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.t - b.t); render(); }, () => {}));
  // les famílies només poden llegir el calendari (les regles no els deixen veure res més)
  UNSUB.push(fs.onSnapshot(col('calendari'), q => { CAL = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || ''))); sincCal(); render(); }, () => { CAL = []; render(); }));
  if (esFam()) return render();
  UNSUB.push(fs.onSnapshot(ref('estat', 'fets'), d => { FETS = d.data() || {}; render(); }));
  UNSUB.push(fs.onSnapshot(ref('estat', 'recepcio'), d => { REC = d.data() || {}; render(); }, () => {}));
  UNSUB.push(fs.onSnapshot(col('comentaris'), q => { COMS = q.docs.map(d => ({ id: d.id, ...d.data() })); render(); }));
  UNSUB.push(fs.onSnapshot(col('jugadors'), q => { JUG = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.nom.localeCompare(b.nom, 'ca')); render(); }));
  UNSUB.push(fs.onSnapshot(col('sessions'), q => {
    if (!D.fs) D.__json = D.sessions;
    const tot = q.docs.map(d => ({ ...d.data(), codi: d.id })).sort((a, b) => (a.ordre ?? 0) - (b.ordre ?? 0)), ss = tot.filter(x => !x.esborrada);
    D.paperera = tot.filter(x => x.esborrada).sort((a, b) => b.esborrada - a.esborrada);
    D.sessions = tot.length ? ss : D.__json; D.fs = !!tot.length; render();
  }, () => {}));
  UNSUB.push(fs.onSnapshot(fs.collection(db, 'equips', CLAU, 'biblioteca'), q => { BIB = {}; q.docs.forEach(d => BIB[d.id] = d.data()); render(); }, () => {}));
  UNSUB.push(fs.onSnapshot(col('ordre'), q => { ORD = {}; q.docs.forEach(d => ORD[d.id] = d.data().ordre); render(); }));
  UNSUB.push(fs.onSnapshot(col('exercicis'), q => { NOF = {}; q.docs.forEach(d => NOF[d.id] = d.data()); render(); }));
  UNSUB.push(fs.onSnapshot(col('partits'), q => { PAR = q.docs.map(d => ({ id: d.id, ...d.data() })).map(p => ({ ...p, data: p.data || avui(), convocats: Array.isArray(p.convocats) ? p.convocats : [], accions: Array.isArray(p.accions) ? p.accions : [], sets: p.sets || {} })).sort((a, b) => (a.data + (a.hora || '')).localeCompare(b.data + (b.hora || ''))); PAR.__ok = true; sincCal(); render(); }));
  UNSUB.push(fs.onSnapshot(col('assistencia'), q => { ASS = q.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.data.localeCompare(a.data)); render(); }));
  render();
}

// calendari/{id}: el que veuen les famílies de cada partit (sense convocats ni estadístiques). El manté l'app dels entrenadors.
const CALK = ['data', 'hora', 'equip', 'rival', 'lloc', 'adreca', 'resultat', 'punts', 'fotos', 'portada'];
const calDe = p => Object.fromEntries(CALK.map(k => [k, p[k] ?? '']));
function sincCal() {
  if (!PAR.__ok || !CAL || !['admin', 'entrenador'].includes(rolActual())) return;
  const ara = Object.fromEntries(CAL.map(c => [c.id, c]));
  PAR.forEach(p => { const n = calDe(p); if (JSON.stringify(n) !== JSON.stringify(ara[p.id] && calDe(ara[p.id]))) fs.setDoc(ref('calendari', p.id), n).catch(e => registraError(e, 'calendari')); });
  CAL.filter(c => !PAR.some(p => p.id === c.id)).forEach(c => fs.deleteDoc(ref('calendari', c.id)).catch(() => {}));
}

function setFets(codes, fet) {
  if (!db) return;
  const t = Date.now(), patch = {};
  codes.forEach(c => { patch[c] = { fet, t }; FETS[c] = { fet, t }; });
  fs.setDoc(ref('estat', 'fets'), patch, { merge: true });
  render();
}

function next(f) {
  if (esFS()) return D.sessions.find(s => !isFet(s.codi) && (!f || deDia(s, f)));   // una sola llista en ordre
  return D.sessions.filter(s => fam(s) === f && !isFet(s.codi)).sort((a, b) => num(a.codi) - num(b.codi))[0];
}

function sessRow(s, prox) {

function blocsOrdenats(s) {

  if (!o) return bs;
  const out = o.map(n => bs.find(b => b.n === n)).filter(Boolean).concat(bs.filter(b => !o.includes(b.n)));
  let t = 0;
  return out.map(b => { const f = `min ${t}-${t + (b.min || 0)}`; t += b.min || 0; return { ...b, franja: f }; });
}

const diesJug = j => j.diesEntreno || (j.dies === 'dimarts' ? [2] : j.dies === 'dijous' || j.nomesDijous ? [4] : null);
const ve = (j, data) => { const d = diesJug(j); return !d || d.includes(new Date(data + 'T12:00').getDay()); };
window.toggleDia = (id, d) => {
  const j = JUG.find(x => x.id === id), all = Object.keys(tcfg().dies).map(Number);
  let cur = diesJug(j) || all.slice();
  cur = cur.includes(d) ? cur.filter(x => x !== d) : [...cur, d].sort();
  if (!cur.length) return;
  jugSet(id, { diesEntreno: all.every(x => cur.includes(x)) ? null : cur, dies: null, nomesDijous: null });
};
const EQ = { N: 'Negre', G: 'Groc', NG: 'Negre i Groc' };
let editEquip = false;
const fetes = () => ASS.filter(a => a.data <= avui());   // llistes de dies que ja han passat
function statsJug(inactius) {
  // per jugador: entrenos des que hi és, vingudes, avisa, no avisa
  return JUG.filter(j => inactius ? j.actiu === false : j.actiu !== false).map(j => {
    let tot = 0, si = 0, av = 0, no = 0, totM = 0, siM = 0;
    const mes = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);   // últims 30 dies
    fetes().forEach(a => { const e = a.estat?.[j.id]; if (!e) return;
      if (e !== 'si' && !ve(j, a.data)) return;   // els dies que no li toca venir no compten
      tot++; if (e === 'si') si++; else if (e === 'avisa') av++; else no++;
      if (a.data >= mes) { totM++; if (e === 'si') siM++; } });
    return { ...j, tot, si, av, no, pct: tot ? Math.round(100 * si / tot) : null, pctM: totM ? Math.round(100 * siM / totM) : null };
  }).sort((a, b) => (b.pct ?? -1) - (a.pct ?? -1) || a.nom.localeCompare(b.nom, 'ca'));
}
const venen = a => Object.values(a.estat || {}).filter(e => e === 'si').length;
const noAvisen = a => Object.values(a.estat || {}).filter(e => e === 'no').length;

function viewAssistencia() {
  if (!CLAU) return `<h2>Assistència</h2>${needKey('portar l\'assistència')}`;
  if (editAss) return viewEditAss();
  const st = statsJug(), F = fetes(), mitjana = F.length ? (F.reduce((s, a) => s + venen(a), 0) / F.length) : 0;
  return `<h2>Assistència</h2>
  <div class="stats">
    <div class="stat"><b>${F.length}</b><span>entrenos</span></div>
    <div class="stat"><b>${mitjana ? mitjana.toFixed(1).replace('.', ',') : '–'}</b><span>de mitjana</span></div>
    <div class="stat"><b>${JUG.filter(j => j.actiu !== false).length}</b><span>jugadors</span></div>
  </div>
  <button class="btn primary" style="width:100%;padding:12px" onclick="newAss()">+ Passar llista d'avui</button>
  <details class="card plega" ${(PLEG.assj ?? true) ? 'open' : ''} ontoggle="obertPart('assj', '', this.open)"><summary><b>Jugadors (${st.length})</b><span class="meta">${st.length ? 'Mitjana de la temporada: ' + Math.round(st.filter(j => j.pct != null).reduce((t, j) => t + j.pct, 0) / (st.filter(j => j.pct != null).length || 1)) + '%' : 'Encara no hi ha jugadors'}</span></summary>${st.length ? `<div class="pl phead"><span class="nom"></span><span class="pct" style="width:50px">Temp.</span><span class="pct mes">Mes</span></div>` : ''}${st.length ? st.map(j => `<div class="pl">
      <span class="nom ${j.no ? 'no' : ''}">${av(j)}<a class="nomlink" href="#/j/${j.id}">${esc(j.nom)}</a>${j.equip && dosEq() ? `<span class="eq">${j.equip === 'NG' ? 'N+G' : j.equip}</span>` : ''}</span>
      ${j.no ? `<span class="red" title="Faltes sense avisar">💀${j.no}</span>` : ''}
      <span class="pct">${j.pct ?? '–'}${j.pct != null ? '%' : ''}</span>
      <span class="pct mes ${j.pctM != null && j.pct != null && j.pctM < j.pct - 10 ? 'baixa' : ''}">${j.pctM ?? '–'}${j.pctM != null ? '%' : ''}</span>
    </div>`).join('') : '<p class="meta" style="margin:0">Encara no hi ha jugadors. Afegeix-los a baix.</p>'}</details>
  ${statsJug(true).length ? `<p class="meta">Ja no hi són: ${statsJug(true).map(j => `<a href="#/j/${j.id}">${esc(j.nom)}</a> (${j.pct ?? '–'}${j.pct != null ? '%' : ''})`).join(', ')}</p>` : ''}
  <p class="meta">Toca un nom per veure els seus entrenos i partits. % = entrenos que ha vingut sobre els que s'han passat llista, des de l'inici de la temporada i dels últims 30 dies (en vermell si l'últim mes baixa més de 10 punts). En vermell, qui ha faltat alguna vegada sense avisar (💀 = quantes).</p>
  <h3>Equip</h3>
  ${editEquip ? `<div class="card eqlist">
    ${JUG.slice().sort((a, b) => (a.actiu === false) - (b.actiu === false) || a.nom.localeCompare(b.nom, 'ca')).map(j => { const dj = diesJug(j), eqs = !dosEq() ? [] : j.equip === 'NG' ? ['N', 'G'] : j.equip ? [j.equip] : [];
      return `<button class="eqrow ${j.actiu === false ? 'inactiu' : ''}" onclick="editaJug('${j.id}')">
        <span class="eqd">${esc(dors(j.id) || '–')}</span>${posOk(j.posicio) ? `<i class="pb pb-${j.posicio} inl" title="${POS[j.posicio].t}">${POS[j.posicio].l}</i>` : ''}
        <span class="eqn">${esc(j.nom)}${j.actiu === false ? '<small>ja no és a l\'equip</small>' : ''}</span>
        ${dj ? `<span class="pill">${dj.map(d => CURT[d]).join('+')}</span>` : ''}
        ${eqs.map(e => `<span class="nos ${e === 'G' ? 'g' : 'n'}">${e}</span>`).join('')}
        <span class="chev">›</span></button>`; }).join('')}
    <div class="actions"><button class="btn primary" style="flex:1" onclick="editaJug()">＋ Afegeix un jugador</button><button class="btn" onclick="editEquip=false;render()">Fet</button></div>
    <p class="meta" style="margin:8px 0 0">Toca un jugador per canviar-li el nom, el dorsal, els dies que ve o l'equip.</p>
  </div>` : `<button class="btn" style="width:100%;padding:10px" onclick="editEquip=true;render()">✎ Editar equip</button>`}
  <details class="card plega entl" ${(PLEG.asse ?? true) ? 'open' : ''} ontoggle="obertPart('asse', '', this.open)"><summary><b>Entrenos (${ASS.length})</b><span class="meta">${ASS[0] ? 'Últim: ' + dataCa(ASS[0].data) + ', ' + venen(ASS[0]) + ' han vingut' : 'Encara cap'}</span></summary>
  <div class="list">${ASS.map(a => `<div class="card selrow" onclick="openAss('${a.id}')"><div class="row">
      <span class="grow"><b>${dataCa(a.data)}</b> ${a.sessio ? `<span class="code">${a.sessio}</span>` : ''}</span>
      <span>${a.data > avui() ? '<span class="tag">previst</span> ' : ''}✅ ${venen(a)}</span>${noAvisen(a) ? `<span class="red">💀${noAvisen(a)}</span>` : ''}</div></div>`).join('') || '<p class="meta">Encara no hi ha cap entreno registrat.</p>'}</div></details>
`;
}

function viewEditAss() {
  const a = editAss, ss = D.sessions.slice().sort((x, y) => fam(x).localeCompare(fam(y)) || num(x.codi) - num(y.codi));
  const actius = JUG.filter(j => a.estat[j.id] || (j.actiu !== false && ve(j, a.data) && (!j.alta || j.alta <= a.data)));
  return `<h2>Llista del ${dataCa(a.data)}</h2>
  <div class="card">
    <label class="lbl">Data</label><input type="date" value="${a.data}" onchange="assDate(this.value)">
    <label class="lbl">Sessió que heu fet</label>
    <select onchange="assSessio(this.value)"><option value="">—</option>${ss.map(s => `<option value="${s.codi}" ${a.sessio === s.codi ? 'selected' : ''}>${s.codi} ${esc(s.titol)}</option>`).join('')}</select>
  </div>
  <div class="card">
    ${llistaRows(a, actius)}
  </div>
  <p class="meta">Es desa sol a cada toc.</p>
  <div class="actions"><button class="btn primary" style="flex:1" onclick="editAss=null;render()">✓ Fet</button>
  <button class="btn danger" onclick="delAss()">Esborra la llista</button></div>`;
}

function llistaRows(a, actius) {
  return `<div class="counts"><span class="est si">✅ ${Object.values(a.estat).filter(e => e === 'si').length} venen</span><span class="est avisa">❌ ${Object.values(a.estat).filter(e => e === 'avisa').length} avisen</span><span class="est no">💀 ${Object.values(a.estat).filter(e => e === 'no').length} no avisen</span></div>
    ${(() => { const v = Object.keys(a.estat).filter(id => a.estat[id] === 'si'), n = k => v.filter(id => posJ(id) === k).length, sense = v.filter(id => !posJ(id)).length;
      return v.length ? `<div class="perpos">${Object.keys(POS).map(k => `<span title="${POS[k].t}"><i class="pb pb-${k} inl">${POS[k].l}</i> ${n(k)}</span>`).join('')}${sense ? `<span class="meta">${sense} sense posició</span>` : ''}</div>` : ''; })()}
    ${actius.map(j => `<div class="pl"><span class="nom ${a.estat[j.id] === 'no' ? 'no' : ''}">${av(j)}<span class="nm">${esc(j.nom)}</span></span><span class="tri">
      ${['si', 'avisa', 'no'].map(e => `<button class="${e} ${a.estat[j.id] === e ? 'on' : ''}" title="${EST[e]}" aria-label="${EST[e]}" onclick="setEst('${j.id}','${e}')">${ESTI[e]}</button>`).join('')}
    </span></div>`).join('') || '<p class="meta">Primer afegeix jugadors a la pantalla d\'assistència.</p>'}`;
}
const actiusLlista = a => JUG.filter(j => a.estat[j.id] || (j.actiu !== false && ve(j, a.data) && (!j.alta || j.alta <= a.data)));
// la llista es passa des de la mateixa sessió (28-10-2026): queda lligada a la sessió del dia
function llistaSessio(c) {
  if (editAss && editAss.sessio === c) return `<details class="card llses" open><summary><b>Llista del ${dataCa(editAss.data)}</b></summary>
    ${llistaRows(editAss, actiusLlista(editAss))}
    <div class="actions"><button class="btn primary" style="flex:1" onclick="editAss=null;render()">✓ Llista feta</button></div></details>`;
  const a = ASS.find(x => x.sessio === c);
  if (a) return `<div class="card row llses"><span class="grow"><b>${dataCa(a.data)}</b> · ✅ ${venen(a)} venen${noAvisen(a) ? ` · <span class="red">💀${noAvisen(a)}</span>` : ''}</span><button class="btn" onclick="openAss('${a.id}')">Edita la llista</button></div>`;
  if (isFet(c)) return '';
  return `<button class="btn primary" onclick="passaLlista('${c}')">Passar llista</button>`;
}
// a dalt de la sessió: passar llista i editar, en una sola fila
// compartir la sessió com a modèlica: una còpia a /models/{uid}_{temporada}_{codi}, que es manté al dia en desar-la
const modelId = c => `${USR?.uid}_${TEMP}_${c}`.replace(/[\/\s·]+/g, '_');
const modelDe = s => ({ per: USR.uid, equip: [club(), gcfg().nom].filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join(' · '), codi: s.codi, titol: s.titol, min: +s.min || durada(s), nota: s.nota || '', ordre: s.ordre ?? 0,
  blocs: s.blocs.filter(b => !b.tret).map(netBloc), t: Date.now() });
window.treuModel = async c => { if (await dialeg('Deixar de compartir aquesta sessió?<br><small>Els equips que ja l\'hagin copiada es queden la seva còpia.</small>', { ok: 'Deixa de compartir-la' })) posaModel(c, false); };
window.posaModel = async (c, on) => {
  if (!USR) return desat('Cal entrar amb el compte de Google');
  const s = byCode(c);
  if (on) await fs.setDoc(fs.doc(db, 'models', modelId(c)), modelDe(s)); else await fs.deleteDoc(fs.doc(db, 'models', modelId(c)));
  await fs.updateDoc(ref('sessions', c), { model: on }); MODELS = null;
  desat(on ? '✓ Sessió compartida' : 'Ja no es comparteix');
};
function capSessio(c) {
  const ll = CLAU ? llistaSessio(c) : '', boto = ll.startsWith('<button'), ed = esFS() && potEditar() ? `<button class="btn" onclick="editaSessio('${c}')">✎ Edita la sessió</button>` : '';
  const s = byCode(c), mod = esFS() && potEditar() && USR ? (s.model
    ? `<button class="btn compartida" onclick="treuModel('${c}')" title="Compartida: la poden copiar altres equips">✓ Compartida</button>`
    : `<button class="btn" onclick="posaModel('${c}', true)" title="Que la puguin copiar altres equips">↗ Comparteix</button>`) : '';
  return `${boto || ed || mod ? `<div class="selbar tres">${boto ? ll : ''}${ed}${mod}</div>` : ''}${boto ? '' : ll}`;
}
window.passaLlista = c => {
  const ja = ASS.find(x => x.id === avui());
  if (!ja) return newAss(c);
  editAss = JSON.parse(JSON.stringify(ja));
  if (editAss.sessio !== c) { editAss.sessio = c; assWrite(); }
  render();
};

function assWrite() {
  const a = editAss;
  fs.setDoc(ref('assistencia', a.id), { data: a.data, sessio: a.sessio || '', estat: a.estat });
  if (a.sessio && a.data < avui() && !isFet(a.sessio)) setFets([a.sessio], true);   // només si l'entreno ja ha passat (el mateix dia es marca amb ✓ Feta)
}
window.newAss = c => {
  const d = avui(), ja = ASS.find(x => x.id === d);
  if (ja) return openAss(d);                                   // ja hi ha llista d'avui: s'obre
  const f = esFS() ? (tcfg().dies?.[new Date(d + 'T12:00').getDay()] ? new Date(d + 'T12:00').getDay() : null) : famDia(d);
  const estat = {}; JUG.filter(j => j.actiu !== false && ve(j, d) && (!j.alta || j.alta <= d)).forEach(j => estat[j.id] = 'si');
  editAss = { id: d, data: d, sessio: c || (f ? next(f)?.codi || '' : ''), estat }; assWrite(); render(); scrollTo(0, 0);
};
window.openAss = id => { const a = ASS.find(x => x.id === id); editAss = JSON.parse(JSON.stringify(a)); render(); scrollTo(0, 0); };
window.setEst = (jid, e) => {
  editAss.estat[jid] = e; fs.updateDoc(ref('assistencia', editAss.id), { ['estat.' + jid]: e });
  const y = scrollY; render(); scrollTo(0, y);
};
window.assSessio = v => { editAss.sessio = v; assWrite(); };
window.assDate = d => {
  if (!d || d === editAss.id) return;
  if (ASS.some(x => x.id === d)) { dialeg('Ja hi ha una llista per a aquest dia.', { sol: true }); return render(); }
  fs.deleteDoc(ref('assistencia', editAss.id));
  if (d > avui()) editAss.sessio = '';   // un dia futur no porta sessió proposada
  editAss.id = editAss.data = d; assWrite(); render();
};
window.delAss = async () => { if (await dialeg(`Esborrar la llista del <b>${dataCa(editAss.data)}</b>?`, { ok: 'Esborra-la', perill: true })) { fs.deleteDoc(ref('assistencia', editAss.id)); editAss = null; render(); } };
window.treuJug = async id => { const j = JUG.find(x => x.id === id); if (await dialeg(`Treure <b>${esc(j.nom)}</b> de l'equip?<br><small>El que ja ha fet es guarda.</small>`, { ok: 'Treu-lo', perill: true, ico: '👋' })) jugSet(id, { actiu: false }); };
window.jugSet = (id, patch) => { if (patch.nom === '') return render(); fs.setDoc(ref('jugadors', id), patch, { merge: true }); };
// finestra per editar (o afegir, sense id) un jugador
window.editaJug = id => {
  const j = id ? JUG.find(x => x.id === id) : { nom: '', dorsal: '' }, dies = Object.keys(tcfg().dies).map(Number).sort();
  const dj = id ? diesJug(j) : null;
  obreFitxa(`<b>${id ? esc(j.nom) : 'Jugador nou'}</b><div class="form">
    <div class="grid2" style="grid-template-columns:70px 1fr"><div><label class="lbl">Dorsal</label><input type="text" id="ejd" inputmode="numeric" maxlength="3" placeholder="#" value="${esc(j.dorsal ?? '')}" style="text-align:center;font-weight:700"></div>
      <div><label class="lbl">Nom</label><input type="text" id="ejn" data-cap="w" value="${esc(j.nom)}" placeholder="Nom i inicial"></div></div>
    <label class="lbl">Posició</label><div class="seg pos5" id="ejp" style="margin:0">${[...Object.entries(POS).map(([k, x]) => [k, x.t]), ['', '–']].map(([v, t]) => `<button class="${posOk(j.posicio) === v ? 'on' : ''}" data-v="${v}" onclick="this.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === this))">${t}</button>`).join('')}</div>
    ${dies.length > 1 ? `<label class="lbl">Dies que ve</label><div class="seg" id="ejdies" style="margin:0">${dies.map(d => `<button class="${!dj || dj.includes(d) ? 'on' : ''}" data-d="${d}" onclick="this.classList.toggle('on')">${DIES[d]}</button>`).join('')}</div>` : ''}
    ${dosEq() ? `<label class="lbl">Equip</label><div class="seg" id="ejeq" style="margin:0">${[['N', 'Negre'], ['G', 'Groc'], ['NG', 'Tots dos'], ['', '–']].map(([v, t]) => `<button class="${(j.equip || '') === v ? 'on' : ''}" data-v="${v}" onclick="this.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === this))">${t}</button>`).join('')}</div>` : ''}
    ${id ? `<label class="lbl">A l'equip des del</label><input type="date" id="eja" value="${j.alta || ''}">` : ''}
    ${id ? (j.actiu === false ? `<button class="btn" style="width:100%;margin-top:12px" onclick="jugSet('${id}', {actiu: true});tancaFitxa()">↺ Torna'l a l'equip</button>`
      : `<button class="btn danger" style="width:100%;margin-top:12px" onclick="tancaFitxa();treuJug('${id}')">Treu-lo de l'equip</button>`) : ''}
    </div>`, `<button class="btn" onclick="tancaFitxa()">Cancel·la</button><button class="btn primary" style="flex:1" onclick="desaJug(${id ? `'${id}'` : ''})">Desa</button>`);
  setTimeout(() => !id && $('#ejn')?.focus(), 50);
};
window.desaJug = id => {
  const nom = $('#ejn').value.trim(); if (!nom) return $('#ejn').focus();
  const totsD = Object.keys(tcfg().dies).map(Number).sort(), sel = $('#ejdies') ? [...$('#ejdies').querySelectorAll('button.on')].map(b => +b.dataset.d) : totsD;
  if (!sel.length) return desat('Tria com a mínim un dia');
  const dades = { nom, dorsal: $('#ejd').value.trim(), diesEntreno: sel.length === totsD.length ? null : sel, dies: null, nomesDijous: null };
  if ($('#ejeq')) dades.equip = $('#ejeq').querySelector('button.on')?.dataset.v || '';
  dades.posicio = $('#ejp').querySelector('button.on')?.dataset.v || '';
  if (id) { if ($('#eja')) dades.alta = $('#eja').value || null; jugSet(id, dades); }
  else fs.addDoc(col('jugadors'), { ...dades, actiu: true, alta: avui() });
  tancaFitxa();
};
window.addJug = () => {
  const n = $('#nounom').value.trim(); if (!n) return;
  fs.addDoc(col('jugadors'), { nom: n, actiu: true, alta: avui() });
  $('#nounom').value = '';
};

// ------------------------------------------------------------- fitxa del jugador
const EQN = { N: 'Negre', G: 'Groc' };
const jugat = p => !!p.resultat || p.data < avui();   // un partit amb resultat ja no és pròxim
const eqNom = e => dosEq() ? EQN[e] || '' : '';
const nomNostre = p => (club() + ' ' + eqNom(p.equip)).trim() || 'Nosaltres';
const partitsDe = id => PAR.filter(p => (p.convocats || []).includes(id));
function statsPartits(id, eq) {
  // partits convocat (total i per equip) i % de sets jugats segons les alineacions
  const ps = partitsDe(id).filter(p => !eq || p.equip === eq);
  let sets = 0, jugats = 0;
  // el lliure compta com a set jugat; els centrals per qui entra el lliure, mig set
  ps.forEach(p => Object.values(p.sets || {}).forEach(pos => {
    const dins = ['1', '2', '3', '4', '5', '6', 'L'].map(k => pos?.[k]).filter(Boolean);
    if (!dins.length) return;
    sets++;
    if (dins.includes(id)) jugats += pos.L && esCentral(pos, id) ? .5 : 1;
  }));
  return { j: JUG.find(x => x.id === id), tot: ps.length, N: ps.filter(p => p.equip === 'N').length, G: ps.filter(p => p.equip === 'G').length, sets, jugats, pct: sets ? Math.round(100 * jugats / sets) : null };
}
const anell = (pct, lab) => `<div class="ring" style="--p:${pct ?? 0}"><div><b>${pct ?? '–'}${pct != null ? '%' : ''}</b><span>${lab}</span></div></div>`;
function viewJugador(id) {
  const j = JUG.find(x => x.id === id); if (!j) return '<p class="empty">No trobo aquest jugador.</p>';
  const st = statsJug(j.actiu === false).find(x => x.id === id) || {};
  const llistes = ASS.filter(a => a.estat?.[id]).sort((a, b) => b.data.localeCompare(a.data));
  const ps = partitsDe(id), sp = statsPartits(id), dj = diesJug(j);
  const eqs = !dosEq() ? [] : j.equip === 'NG' ? ['N', 'G'] : j.equip ? [j.equip] : [];
  return `<div class="card jcard ${j.actiu === false ? 'inactiu' : ''}">
    ${av(j, true)}<div class="grow"><h2>${dors(j.id) ? `<span class="dnum">${esc(dors(j.id))}</span> ` : ''}${esc(j.nom)}</h2>
    <div class="jtags">${eqs.map(e => `<span class="nos ${e === 'G' ? 'g' : 'n'}">${EQN[e]}</span>`).join('')}
      <span class="pill">📅 ${dj ? dj.map(d => CURT[d]).join(' + ') : 'Tots els dies'}</span>

// ---------------------------------------------------------------- cronòmetre
// Compte enrere (dur > 0) o cronòmetre (dur = 0). Continua encara que canviïs de pantalla.
// L'alarma és un fitxer d'àudio que es reprodueix des del principi: silenci fins al final del
// compte enrere i després l'alarma. Com que és àudio normal, sona encara que bloquegis el mòbil.
const T = { dur: 0, start: 0, acc: 0, run: false, lab: '', beeped: false, tick: null };
const two = n => String(n).padStart(2, '0');
const fmt = ms => { const s = Math.max(0, Math.round(ms / 1000)); return two(Math.floor(s / 60)) + ':' + two(s % 60); };
const elapsed = () => T.acc + (T.run ? Date.now() - T.start : 0);
const PLAYER = new Audio(); PLAYER.preload = 'auto';
let AUDIO_URL = null, AC = null, ALARM = null;

function wav(silenceSec) {
  // WAV 8 bits, 8 kHz: silenci + 15 segons d'alarma (4 xiulets aguts cada 1,1 s)
  const R = 8000, alarm = 15, n = Math.round((silenceSec + alarm) * R), buf = new Uint8Array(44 + n), v = new DataView(buf.buffer);
  const str = (o, t) => [...t].forEach((c, i) => buf[o + i] = c.charCodeAt(0));
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, R, true); v.setUint32(28, R, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, 'data'); v.setUint32(40, n, true);
  buf.fill(128, 44);
  const s0 = Math.round(silenceSec * R);
  for (let i = s0; i < n; i++) {
    const t = (i - s0) / R, c = t % 1.1, k = Math.floor(c / .18);
    if (k < 4 && c - k * .18 < .13) { const f = k % 2 ? 2600 : 2000; buf[44 + i] = ((i * f / R) % 1) < .5 ? 250 : 6; }
  }
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}
function audioArm() {
  // es crida en prémer Comença (els mòbils només deixen sonar àudio que surt d'un toc)
  if (AUDIO_URL) URL.revokeObjectURL(AUDIO_URL);
  AUDIO_URL = wav(Math.max(0, (T.dur - elapsed()) / 1000));
  PLAYER.src = AUDIO_URL; PLAYER.currentTime = 0;
  PLAYER.play().catch(() => {});
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: T.lab || 'Compte enrere', artist: gcfg().nom + ' ' + tempNom(TEMP) });
    navigator.mediaSession.setActionHandler('pause', () => { if (T.run) timerGo(); });
    navigator.mediaSession.setActionHandler('stop', () => alarmStop());
  }
}
function webBeepFallback() {
  // per si el fitxer no ha pogut sonar: xiulets amb WebAudio mentre l'app és oberta
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume();
    const go = () => { const t0 = AC.currentTime; [0, .18, .36, .54].forEach((d, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = i % 2 ? 2600 : 2000; g.gain.value = 1; o.connect(g); g.connect(AC.destination); o.start(t0 + d); o.stop(t0 + d + .13); }); };
    go(); ALARM = setInterval(go, 1100); setTimeout(alarmStop, 15000);
  } catch {}
}
function alarmStart() {
  const ok = !PLAYER.paused && PLAYER.currentTime > 0;
  if (!ok) webBeepFallback();
  try { navigator.vibrate?.([500, 200, 500, 200, 500, 200, 500]); } catch {}
  $('#tstop').hidden = false;
  timerToggle(true);
}
window.alarmStop = () => {
  PLAYER.pause(); clearInterval(ALARM); ALARM = null;
  try { navigator.vibrate?.(0); } catch {}
  $('#tstop').hidden = true;
  if (T.dur && T.run && T.dur - elapsed() <= 0) { T.run = false; T.acc = T.dur; clearInterval(T.tick); timerPaint(); }
};
function timerPaint() {
  const e = elapsed(), left = T.dur - e, end = T.dur && left <= 0, dig = $('#tdig');
  const show = T.run || e ? (T.dur ? fmt(Math.abs(left)) : fmt(e)) : (T.dur ? fmt(T.dur) : '00:00');
  const [mm, ss] = show.split(':');
  if (document.activeElement !== $('#tm')) { $('#tm').value = (end ? '-' : '') + mm; $('#tm').style.width = ($('#tm').value.length + .3) + 'ch'; }
  if (document.activeElement !== $('#ts')) $('#ts').value = ss;
  $('#tm').readOnly = $('#ts').readOnly = T.run;
  $('#thint').hidden = T.run;
  dig.classList.toggle('end', !!end);
  $('#tlab').textContent = T.lab;
  $('#tgo').textContent = T.run ? '⏸ Pausa' : (e ? '▶ Continua' : '▶ Comença');
  $('#tbtn').classList.toggle('run', T.run);
  const mini = $('#tmini'); mini.hidden = !$('#timer').hidden || !(T.run || end); mini.textContent = '⏱ ' + (end ? '-' : '') + show; mini.classList.toggle('end', !!end);
  if (end && !T.beeped) { T.beeped = true; alarmStart(); }
  // rodes: només abans de començar; segueixen el valor triat amb els números o els botons
  const rd = $('#trodes'); rd.hidden = T.run || !!e;
  if (!rd.hidden && !rodaTocant) { posaRoda('#trm', Math.floor(T.dur / 60000)); posaRoda('#trs', Math.round(T.dur / 1000) % 60); }
}
// rodes del compte enrere (minuts 0-60, segons 0-59): en deixar de lliscar, el valor passa al cronòmetre
let rodaTocant = false, rodaProg = 0, rodaT = null;
['#trm', '#trs'].forEach((sel, k) => {
  const el = $(sel); el.innerHTML = '<i></i><i></i>' + Array.from({ length: k ? 60 : 61 }, (_, x) => `<span>${two(x)}</span>`).join('') + '<i></i><i></i>';
  el.addEventListener('scroll', () => {
    if (Date.now() < rodaProg) return;
    rodaTocant = true; clearTimeout(rodaT);
    rodaT = setTimeout(() => {
      rodaTocant = false;
      const m = Math.round($('#trm').scrollTop / 40), sc = Math.round($('#trs').scrollTop / 40);
      if (m * 60000 + sc * 1000 !== T.dur) timerSet((m * 60 + sc) / 60, m || sc ? '' : 'Cronòmetre');
    }, 180);
  });
});
function posaRoda(sel, v) { const el = $(sel); if (Math.round(el.scrollTop / 40) !== v) { rodaProg = Date.now() + 250; el.scrollTop = v * 40; } }
window.timerEdit = () => {
  const m = Math.max(0, parseInt($('#tm').value.replace('-', '')) || 0), sc = Math.min(59, Math.max(0, parseInt($('#ts').value) || 0));
  timerSet((m * 60 + sc) / 60, m || sc ? '' : 'Cronòmetre');
};
window.timerToggle = show => {
  const el = $('#timer'), v = show ?? el.hidden; el.hidden = !v; timerPaint();
};
window.timerSet = (min, lab, go) => {
  alarmStop(); PLAYER.removeAttribute('src');
  T.dur = Math.round(min * 60000); T.acc = 0; T.run = false; T.beeped = false; clearInterval(T.tick);
  T.lab = lab || (min ? 'Compte enrere' : 'Cronòmetre');
  timerToggle(true); if (go) timerGo(); else timerPaint();
};
window.timerGo = () => {
  if (T.run) { T.acc = elapsed(); T.run = false; clearInterval(T.tick); PLAYER.pause(); }
  else {
    if (T.dur && T.dur - elapsed() <= 0) { T.acc = 0; T.beeped = false; }   // tornar a començar un compte acabat
    T.start = Date.now(); T.run = true; T.tick = setInterval(timerPaint, 250);
    if (T.dur) audioArm();
  }
  timerPaint();
};
window.timerReset = () => { alarmStop(); T.acc = 0; T.beeped = false; if (T.run) { T.start = Date.now(); if (T.dur) audioArm(); } timerPaint(); };

// ------------------------------------------------------------------- render
// tot el que s'escriu comença en majúscula; als noms de jugador (data-cap="w"), cada paraula
function majuscules(el) {
  const v = el.value, n = el.dataset.cap === 'w' ? v.replace(/(^|\s)(\p{Ll})/gu, (m, a, b) => a + b.toUpperCase()) : v.replace(/^(\s*)(\p{Ll})/u, (m, a, b) => a + b.toUpperCase());
  if (n === v) return;
  const a = el.selectionStart, b = el.selectionEnd; el.value = n; try { el.setSelectionRange(a, b); } catch {}
}
document.addEventListener('input', e => { if (e.target.matches?.('input[type=text], textarea') && e.target.id !== 'noutemp' && e.target.id !== 'noutempg') majuscules(e.target); });
const capitalitza = () => document.querySelectorAll('input[type=text], textarea').forEach(el => { el.autocapitalize = el.dataset.cap === 'w' ? 'words' : 'sentences'; });
let lastRuta = null;
// errors: no deixen l'app en blanc i es guarden a /errors perquè Claude els pugui mirar
let errVists = new Set();
function registraError(e, on) {
  const msg = String(e?.message || e || 'error'), clau = msg + on;
  console.error(e); if (errVists.has(clau) || !db || !CLAU) return; errVists.add(clau);
  try { fs.addDoc(fs.collection(db, 'equips', CLAU, 'errors'), { t: Date.now(), msg: msg.slice(0, 300), stack: String(e?.stack || '').slice(0, 1500), on: on || '', ruta: location.hash.slice(0, 80), temporada: TEMP, ua: navigator.userAgent.slice(0, 160) }); } catch {}
}
addEventListener('error', e => registraError(e.error || e.message, 'global'));
addEventListener('unhandledrejection', e => registraError(e.reason, 'promesa'));
function render() {
  try { pintaPantalla(); }
  catch (e) {
    registraError(e, 'render');
    $('#app').innerHTML = `<div class="card warn"><b>Aquesta pantalla ha fallat.</b><div class="meta">L'error s'ha guardat perquè Claude el pugui mirar i arreglar.</div><div class="meta" style="font-size:12px">${esc(e?.message || e)}</div>
      <div class="actions"><a class="btn primary" href="#/">Torna a l'inici</a><button class="btn" onclick="location.reload()">Torna a carregar</button></div></div>`;
  }
}
function pintaPantalla() {
  if (!D) return;
  let [r, arg] = location.hash.replace(/^#\/?/, '').split('/');
  if (r === 'dimarts' || r === 'dijous' || r === 'f') r = 'entrenos';   // enllaços antics (abans hi havia una pestanya per a dimarts i una per a dijous)
  let html, tab = 'inici', title = (Object.keys(grups()).length > 1 ? gcfg().nom : club() || 'Tres Tocs') + ' ' + tempNom(TEMP);
  // sense equip, o amb una invitació per acceptar i sense compte: pantalla d'entrada
  if (!USR && (NOMES_COMPTES || (r !== 'config' && (!CLAU || store.get('volei.invitacio', null))))) { html = viewEntra(); title = 'Tres Tocs'; }
  else if (USR && (!CLAU || (MEM && !rolActual() && (r !== 'config' || !Object.values(MEM.rols || {}).some(Boolean))))) { html = sensePermis(); }
  else if (esFam()) { html = r === 'fotos' ? viewFotos(arg) : r === 'config' ? viewConfigFam() : viewFamilia(); tab = ''; if (r === 'fotos') title = 'Fotos'; }
  else if (r === 'fotos') { html = viewFotos(arg); tab = 'partits'; title = 'Fotos'; }
  else if (r === 's') { html = viewSession(arg); tab = byCode(arg) ? 'entrenos' : ''; title = arg; }
  else if (r === 'entrenos') { html = viewEntrenos(); tab = 'entrenos'; title = 'Sessions'; }
  else if (r === 'f') { html = viewList(arg); tab = 'entrenos'; }
  else if (r === 'assistencia') { html = viewAssistencia(); tab = 'assistencia'; title = 'Assistència'; }
  else if (r === 'config') { html = viewConfig(); tab = ''; title = 'Configuració'; }
  else if (r === 'exercicis') { html = viewBiblio(); tab = 'entrenos'; title = 'Exercicis'; }
  else if (r === 'e') { html = viewExercici(arg); tab = 'entrenos'; title = arg; }
  else if (r === 'j') { html = viewJugador(arg); tab = 'assistencia'; title = 'Jugador'; }
  else if (r === 'partits') { html = viewPartits(); tab = 'partits'; title = 'Partits'; }
  else if (r === 'p') { html = viewPartit(arg); tab = 'partits'; title = 'Partit'; }
  else if (r === 'pissarra') { html = viewPissarra(arg); tab = 'partits'; title = 'Pissarra'; }
  else if (r === 'directe') { html = viewDirecte(arg); tab = 'partits'; title = 'En directe'; }
  else html = viewHome();
  $('#tabs').hidden = $('#tbtn').hidden = !USR || esFam() || !CLAU;   // sense compte o sense club no hi ha res a navegar
  $('#tabs').innerHTML = `<a href="#/" data-t="inici"><span class="ico">${ICO.inici}</span>Inici</a>
    <a href="#/entrenos" data-t="entrenos"><span class="ico">${ICO.pista}</span>Sessions</a>
    <a href="#/assistencia" data-t="assistencia"><span class="ico">${ICO.ass}</span>Assistència</a>
    <a href="#/partits" data-t="partits"><span class="ico">${ICO.partits}</span>Partits</a>`;
  // no repintar mentre s'escriu un comentari
  const a = document.activeElement;
  if (a && ((a.matches?.('input, textarea, select') && a.closest('.sesed, .exed')) || a.id === 'triaq' || a.id === 'com' || a.id === 'bibq' || a.id === 'nounom' || a.id === 'noftxt' || a.id === 'noutemp' || a.id === 'club' || a.id === 'gnom' || a.id === 'nougrup' || a.id === 'nouclub' || a.id === 'noutempg' || a.id === 'rival' || /^p[ab]\d$/.test(a.id) || (a.type === 'text' && a.closest('.edit-pl'))) && $('#app').contains(a)) return;
  $('#app').innerHTML = html;
  const ruta = r + '/' + arg;
  muntaCalendari(); capitalitza();
  document.documentElement.style.setProperty('--hh', $('header').offsetHeight + 'px');   // per al marcador fix del directe
  if (ruta !== lastRuta) { lastRuta = ruta; const ap = $('#app'); ap.classList.remove('view'); void ap.offsetWidth; ap.classList.add('view'); }
  $('#title').textContent = title;
  $('#back').hidden = !['s', 'config', 'j', 'p', 'pissarra', 'directe', 'fotos', 'e'].includes(r);
  document.querySelectorAll('nav.tabs a').forEach(x => x.classList.toggle('on', x.dataset.t === tab));
}
window.render = render;
Object.defineProperty(window, 'editEquip', { get: () => editEquip, set: v => { editEquip = v; } });
Object.defineProperty(window, 'editAss', { get: () => editAss, set: v => { editAss = v; } });
Object.defineProperty(window, 'sesEd', { get: () => sesEd, set: v => { sesEd = v; } });
Object.defineProperty(window, 'exEd', { get: () => exEd, set: v => { exEd = v; } });
Object.defineProperty(window, 'novaTab', { get: () => novaTab, set: v => { novaTab = v; } });

$('#back').onclick = () => history.length > 1 ? history.back() : (location.hash = '#/');
addEventListener('hashchange', () => { fotoTanca(); const mi = location.hash.match(/^#\/uneix\/([A-Za-z0-9]{24,})\/([A-Za-z0-9]{12,})/); if (mi) { store.set('volei.invitacio', { clau: mi[1], codi: mi[2] }); if (USR) quiSoc(); } sel = null; convDesfes = null; editAss = null; nofEdit = null; ordering = false; editEquip = false; if (!/^#\/(p|pissarra|directe)\//.test(location.hash)) setActiu = 1; dirJug = null; tancaFitxa(); render(); scrollTo(0, 0); });
TEMP = TEMP || CFG.actual;
fetch(tcfg().sessions, { cache: 'no-cache' }).then(r => r.json())
  .then(d => { D = d; D.__file = tcfg().sessions; render(); initFirebase(); })
  .catch(() => { $('#app').innerHTML = '<p class="empty">No s\'han pogut carregar les sessions. Comprova la connexió.</p>'; });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
